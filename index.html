<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Star Tracker">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e1b4b">
    
    <title>Kids Star Tracker Pro v5.1</title>
    
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --card-bg: rgba(30, 41, 59, 0.75);
            --blue: #38bdf8;
            --blue-glow: rgba(56, 189, 248, 0.5);
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.6);
            --pink: #f472b6;
            --pink-glow: rgba(244, 114, 182, 0.5);
            --green: #4ade80;
            --purple: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.5);
            --text: #ffffff;
            --success: #22c55e;
            --cool-yellow: #fde047;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 10px; }

        html { background-color: #0f172a; height: 100%; width: 100%; }

        body {
            margin: 0;
            padding: max(10px, env(safe-area-inset-top)) 15px 10px 15px;
            background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 40%, #0f172a 100%);
            background-size: 300% 300%;
            animation: gradientBG 15s ease infinite;
            color: var(--text);
            font-family: 'Baloo 2', cursive, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed; top: 0; left: 0; width: 200%; height: 200%;
            background-image:
                radial-gradient(circle at 15% 25%, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                radial-gradient(circle at 75% 15%, rgba(255, 255, 255, 0.15) 2px, transparent 2px),
                radial-gradient(circle at 45% 65%, rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px),
                radial-gradient(circle at 85% 85%, rgba(255, 255, 255, 0.1) 2px, transparent 2px),
                radial-gradient(circle at 25% 75%, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 150px 150px;
            animation: drift 40s linear infinite;
            z-index: -1; pointer-events: none;
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes drift { 0% { transform: translate(0, 0) rotate(0deg); } 100% { transform: translate(-75px, -75px) rotate(3deg); } }

        .flying-emoji {
            position: fixed; font-size: 3.5rem; pointer-events: none; z-index: 5; 
            opacity: 0; animation: flyEmoji linear forwards; filter: drop-shadow(0 0 15px rgba(255,255,255,0.4));
        }

        @keyframes flyEmoji {
            0% { transform: translate(var(--startX), var(--startY)) rotate(var(--startRot)) scale(0.5); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: translate(var(--endX), var(--endY)) rotate(var(--endRot)) scale(1.3); opacity: 0; }
        }

        #app {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 10px; 
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 0 0 10px 0; }
        
        .header-left {
            display: flex; flex-direction: column; align-items: flex-start; background-color: #facc15;
            background-image: radial-gradient(circle, rgba(255,255,255,0.4) 2.5px, transparent 2.5px), linear-gradient(135deg, rgba(250, 204, 21, 0.9), rgba(234, 179, 8, 0.9));
            background-size: 14px 14px, 100% 100%; padding: 8px 15px; border-radius: 15px;
            box-shadow: 0 6px 15px rgba(234, 179, 8, 0.4), inset 0 4px 6px rgba(255,255,255,0.6);
            border: 2px solid #fef08a; transform: rotate(-2deg); position: relative;
        }

        h1 { 
            font-size: 1.8rem; margin: 0; line-height: 1; color: #ffffff; letter-spacing: 1.5px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3); font-weight: 900; animation: pulseText 3s ease-in-out infinite;
        }
        @keyframes pulseText { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        .designer-credit {
            font-size: 0.75rem; color: #a16207; font-weight: 800; margin-top: 2px;
            text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 0 1px 2px rgba(255,255,255,0.4);
        }

        .version-bar {
            display: flex; justify-content: flex-start; align-items: center; gap: 8px; font-size: 0.85rem; 
            color: #ffffff; font-weight: 800; margin-top: 2px; letter-spacing: 1px; height: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444; transition: all 0.3s ease; }

        .btn-info {
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--blue); color: var(--blue);
            padding: 6px 12px; border-radius: 15px; font-family: 'Baloo 2'; font-weight: 800; font-size: 0.9rem;
            cursor: pointer; margin: 0; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-info:hover { transform: scale(1.05) translateY(-2px); box-shadow: 0 6px 15px rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.15); }
        .btn-info:active { transform: scale(0.95); }
        .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 1.1rem; }

        /* --- LAYOUT MIT ANGEDOCKTEN KARTEN (KID GROUP) --- */
        .main-layout { display: grid; grid-template-columns: 1fr; gap: 20px; flex: 1; }
        
        .kid-group { display: flex; height: 100%; min-height: 100%; animation: floatCard 6s ease-in-out infinite; align-items: stretch; }
        .kid-group:nth-child(even) { animation-delay: -3s; }
        @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        @media (min-width: 850px) {
            .main-layout { grid-template-columns: 1fr 1fr; }
            .kid-group-left .kid-card { border-radius: 25px 0 0 25px !important; border-right: none !important; }
            .kid-group-left .daily-dashboard { border-radius: 0 25px 25px 0 !important; border-left: none !important; }
            
            .kid-group-right .daily-dashboard { border-radius: 25px 0 0 25px !important; border-right: none !important; }
            .kid-group-right .kid-card { border-radius: 0 25px 25px 0 !important; border-left: none !important; }
        }

        @media (max-width: 849px) {
            .kid-group { flex-direction: column; }
            .kid-group-left .kid-card, .kid-group-right .kid-card { border-radius: 25px 25px 0 0 !important; border-bottom: none !important; }
            .kid-group-left .daily-dashboard, .kid-group-right .daily-dashboard { border-radius: 0 0 25px 25px !important; border-top: none !important; width: 100% !important; height: auto !important; }
        }

        /* --- TAGESAUFGABEN DOCKED-DASHBOARD --- */
        .daily-dashboard {
            background: rgba(15, 23, 42, 0.6); padding: 10px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px); display: flex; flex-direction: column; 
            width: 210px; flex-shrink: 0; z-index: 2; position: relative;
        }
        .daily-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; flex-shrink: 0; }
        .daily-header h3 { margin: 0; font-size: 0.95rem; color: var(--gold); font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.5); line-height: 1.1; }
        .btn-undo { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid #ef4444; padding: 2px 6px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.7rem; transition: transform 0.2s; margin-left: 5px; }
        .btn-undo:active { transform: scale(0.9); }
        
        .daily-scroll-container {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 2px;
        }

        .daily-item {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            padding: 4px 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); line-height: 1.1; min-height: 32px;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }
        .daily-item:hover { transform: scale(1.03) translateY(-2px); background: rgba(255,255,255,0.15); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .daily-item:active { transform: scale(0.95); }
        
        .daily-item-text { flex: 1; padding-right: 4px; hyphens: auto; -webkit-hyphens: auto; word-break: break-word; text-align: left; }
        .daily-pts { background: var(--blue); color: #000; padding: 2px 4px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; white-space: nowrap; }
        .daily-empty { text-align: center; color: rgba(255,255,255,0.4); font-size: 0.8rem; font-style: italic; margin-top: 15px; }

        /* --- KID CARDS --- */
        .kid-card {
            background: var(--card-bg); padding: 15px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            backdrop-filter: blur(15px); display: flex; flex-direction: column;
            position: relative; overflow: hidden; flex: 1; min-width: 0; z-index: 1;
        }
        .kid-card > * { position: relative; z-index: 1; }

        .kid-card.theme-0 { background: linear-gradient(135deg, rgba(13, 148, 136, 0.8), rgba(15, 118, 110, 0.95)); border-color: rgba(45, 212, 191, 0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 30px rgba(45, 212, 191, 0.3); }
        .kid-card.theme-0::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0; background-image: radial-gradient(circle at 15% 25%, rgba(255, 255, 255, 0.15) 2px, transparent 3px), radial-gradient(circle at 75% 15%, rgba(255, 255, 255, 0.1) 4px, transparent 5px), radial-gradient(circle at 45% 65%, rgba(255, 255, 255, 0.1) 2px, transparent 3px), url('data:image/svg+xml;utf8,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M30 10 L33 27 L50 30 L33 33 L30 50 L27 33 L10 30 L27 27 Z" fill="rgba(255,255,255,0.04)"/></svg>'); background-size: 100px 100px, 120px 120px, 80px 80px, 60px 60px; }
        .kid-card.theme-1 { background: linear-gradient(135deg, rgba(30, 64, 175, 0.8), rgba(17, 24, 39, 0.95)); border-color: rgba(96, 165, 250, 0.4); box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 30px rgba(59, 130, 246, 0.3); }
        .kid-card.theme-1::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px), radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 70%); background-size: 30px 30px, 30px 30px, 100% 100%; }

        .kid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .kid-info-box { display: flex; align-items: center; gap: 12px; }
        .kid-header h2 { margin: 0; font-size: 2.2rem; font-weight: 800; line-height: 1.1; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
        
        .total-score-badge { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #000; font-size: 1.5rem; font-weight: 900; padding: 4px 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(251, 191, 36, 0.4); white-space: nowrap; transition: transform 0.3s; min-width: 120px; text-align: center; display: inline-block; }
        .btn-kid-reset { background: rgba(255, 255, 255, 0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .avatar-btn { font-size: 50px; background: rgba(255,255,255,0.08); border-radius: 20px; padding: 8px; cursor: pointer; border: 2px solid rgba(255,255,255,0.15); box-shadow: 0 6px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; min-width: 80px; min-height: 80px; transition: transform 0.2s; }
        
        .tally-box { background: rgba(0,0,0,0.3); border-radius: 20px; min-height: 90px; padding: 15px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 8px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; }
        .star-icon { font-size: 2.2rem; color: var(--gold); text-shadow: 0 0 12px var(--gold-glow); opacity: 0; transform: scale(0); animation: popStar 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes popStar { 0% { opacity: 0; transform: scale(0.1) rotate(-30deg); } 70% { transform: scale(1.3) rotate(15deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
        
        .btn-claim { background: linear-gradient(135deg, var(--green), #16a34a); color: white; border: none; padding: 12px; border-radius: 15px; font-weight: 800; font-size: 1.3rem; cursor: pointer; width: 100%; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4); animation: pulseBtn 2s infinite; font-family: 'Baloo 2'; border: 2px solid #bbf7d0; transition: transform 0.2s; }
        @keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        .progress-section { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 15px; margin-bottom: 10px; }
        .progress-title { font-size: 0.95rem; color: #f8fafc; font-weight: 800; margin: 0 0 8px 0; text-align: center; }
        .progress-item { margin-bottom: 8px; }
        .progress-label { display: flex; justify-content: space-between; align-items: flex-end; font-size: 0.85rem; color: #f8fafc; font-weight: 700; margin-bottom: 4px; }
        .goal-name { font-size: 0.95rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .stars-left { background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.1); font-weight: 800; }
        .stars-left.done { background: var(--success); color: white; border-color: #bbf7d0; animation: pulseBtn 2s infinite; box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        .progress-bg { background: rgba(0,0,0,0.6); height: 18px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-shadow: inset 0 3px 6px rgba(0,0,0,0.6); }
        .progress-fill { height: 100%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); animation: moveStripes 2s linear infinite; background-size: 30px 30px; background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent); }
        
        .fill-small { background-color: var(--pink); }
        .fill-big { background-color: var(--gold); }
        .fill-mega { background-color: var(--purple); }

        .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: auto; }
        .btn-action { border: none; border-radius: 15px; font-weight: 800; font-size: 2.2rem; cursor: pointer; height: 65px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 15px rgba(0,0,0,0.3); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .btn-minus { background: #334155; color: #94a3b8; }
        .btn-plus { background: linear-gradient(135deg, #0ea5e9, #6366f1, #d946ef); color: white; border: 1px solid rgba(255,255,255,0.2); }

        /* --- MODALS --- */
        .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(8px); }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content-scroll { background: var(--card-bg); width: 100%; max-width: 450px; max-height: 85vh; padding: 25px; border-radius: 35px; border: 1px solid rgba(255,255,255,0.1); overflow-y: auto; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.6); transform: scale(0.8) translateY(30px); opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .modal.active .modal-content-scroll { transform: scale(1) translateY(0); opacity: 1; }
        .btn-close-top { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; font-weight: bold; cursor: pointer; }
        .modal-fullscreen { max-width: 1200px !important; width: 98% !important; height: 96vh !important; max-height: 96vh !important; padding: 30px !important; display: flex; flex-direction: column; }
        
        .settings-container { display: flex; height: calc(100vh - 150px); margin-top: 20px; }
        .settings-sidebar { width: 240px; border-right: 2px solid rgba(255,255,255,0.1); padding-right: 15px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .settings-main { flex: 1; padding-left: 25px; overflow-y: auto; padding-bottom: 120px; }
        .tab-btn { background: rgba(0,0,0,0.2); color: #94a3b8; border: none; border-radius: 12px; padding: 12px 15px; font-family: 'Baloo 2'; font-weight: 800; font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s; }
        .tab-btn.active { background: var(--blue); color: #000; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .config-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .config-card input, .config-card select { width: 100%; padding: 12px; margin-top: 5px; background: rgba(0,0,0,0.4); border: 1px solid #475569; color: white; border-radius: 12px; font-family: 'Baloo 2'; }
        
        #loading-screen { position: fixed; inset: 0; background: #1e1b4b; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 60px; height: 60px; border: 6px solid rgba(56, 189, 248, 0.2); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: var(--blue); font-weight: bold;">Initialisiere Galaxie...</p>
    </div>

    <div id="message-box" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--card-bg); padding: 15px 30px; border-radius: 25px; border: 2px solid var(--blue); z-index: 2000; display: none; font-weight: bold; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.5);"></div>

    <div id="app">
        <header>
            <div class="header-left">
                <h1>STAR TRACKER</h1>
                <div class="designer-credit">Design by Markus Nussi</div>
                <div class="version-bar">
                    <span>v5.1 IPAD PRO</span>
                    <div id="status-dot" class="status-dot"></div>
                    <div id="unlock-status-container" style="margin-left: 6px; display: flex; align-items: center;"></div>
                </div>
            </div>
            <div style="display: flex; gap: 6px; align-items: center;">
                <button class="btn-info btn-icon" onclick="window.openHistoryModal()" title="Historie">📜</button>
                <button class="btn-info btn-icon" onclick="window.checkPin(() => window.openConfig())" title="Einstellungen">⚙️</button>
                <button class="btn-info" onclick="window.openTasksInfoModal()">📋 Aufgaben</button>
            </div>
        </header>

        <div id="main-layout" class="main-layout"></div>
    </div>

    <!-- Modals -->
    <div id="daily-detail-modal" class="modal">
        <div class="modal-content-scroll" style="text-align: center; max-width: 400px; border: 2px solid var(--blue); position: relative;">
            <button class="btn-close-top" onclick="window.closeModal('daily-detail-modal')" style="z-index: 100;">X</button>
            <div id="dd-emoji" style="font-size: 5rem; margin-bottom: 5px; letter-spacing: -5px;"></div>
            <h2 id="dd-title" style="margin: 0 0 10px 0; color: white; font-size: 1.8rem; line-height: 1.2;"></h2>
            <div id="dd-pts" style="font-size: 1.4rem; color: var(--gold); font-weight: 800; margin-bottom: 25px;"></div>
            <button id="dd-confirm-btn" class="btn-claim" style="font-size: 1.5rem; padding: 15px;">Erledigt! ✅</button>
        </div>
    </div>

    <div id="pin-modal" class="modal">
        <div class="modal-content-scroll" style="max-width: 380px; text-align: center;">
            <h2 style="font-size: 2.5rem; margin-top: 0; margin-bottom: 5px;">PIN eingeben</h2>
            <div class="pin-dots" id="pin-dots" style="display: flex; gap: 15px; justify-content: center; margin-bottom: 20px;">
                <div class="dot" style="width:20px;height:20px;border:2px solid #64748b;border-radius:50%;"></div>
                <div class="dot" style="width:20px;height:20px;border:2px solid #64748b;border-radius:50%;"></div>
                <div class="dot" style="width:20px;height:20px;border:2px solid #64748b;border-radius:50%;"></div>

    <div id="config-modal" class="modal">
        <div class="modal-content-scroll modal-fullscreen">
            <button onclick="window.closeModal('config-modal')" style="position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 12px; padding: 10px 20px; cursor: pointer; font-family: 'Baloo 2'; font-weight: 800;">&larr; Zurück</button>
            <h2 style="color: var(--blue); font-size: 2.2rem; text-align: center; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">⚙️ Zentraleinstellungen</h2>
            
            <div class="settings-container">
                <div class="settings-sidebar">
                    <button class="tab-btn active" onclick="window.switchTab(event, 'tab-kids')">👧👦 Profile</button>
                    <button class="tab-btn" onclick="window.switchTab(event, 'tab-daily')">📅 Tagesplan Editor</button>

                <div class="settings-main">

                        <div id="config-kids-fields"></div>

                    <div id="tab-daily" class="tab-content">
                        <button onclick="window.addNewDailyTaskInput()" style="width:100%; padding:15px; border-radius:15px; background:rgba(255,255,255,0.05); color:white; border:1px dashed rgba(255,255,255,0.4); margin-bottom:15px; cursor:pointer; font-family:'Baloo 2'; font-weight:bold;">+ Neue Tagesaufgabe</button>

                            <button onclick="window.loadDefaultTasks()" style="flex:2; padding:12px; border-radius:12px; background:rgba(56,189,248,0.1); color:var(--blue); border:1px solid var(--blue); cursor:pointer;">📋 Standard & Emojis laden</button>

            <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 15px 30px; background: rgba(15, 23, 42, 0.95); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: flex-end;">
                <button onclick="window.saveConfig()" style="padding:15px 40px; border-radius:15px; background:var(--green); color:white; font-weight:900; border:none; cursor:pointer;">💾 SPEICHERN</button>

    </div>

    <!-- Weitere Modals (History, Info, Add Points) weggelassen für Kürze, Logik bleibt gleich -->
    <div id="history-modal" class="modal"><div class="modal-content-scroll"><button class="btn-close-top" onclick="window.closeModal('history-modal')">X</button><h2>📜 Historie</h2><div id="history-list"></div><div id="history-footer"></div></div></div>
    <div id="info-modal" class="modal"><div class="modal-content-scroll modal-large"><button class="btn-close-top" onclick="window.closeModal('info-modal')">X</button><h2>📋 Aufgaben</h2><div id="info-tasks-list" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:10px;"></div></div></div>
    <div id="add-points-modal" class="modal"><div class="modal-content-scroll modal-large"><button class="btn-close-top" onclick="window.closeModal('add-points-modal')">X</button><h2>Sterne vergeben</h2><div id="add-tasks-list" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px;"></div></div></div>
    <div id="confirm-reset-modal" class="modal"><div class="modal-content-scroll"><h2>Punkte löschen?</h2><div style="display:flex;gap:10px;"><button onclick="window.closeModal('confirm-reset-modal')">Nein</button><button onclick="window.executeMasterReset()" style="background:#ef4444;color:white;">Ja, Löschen!</button></div></div></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const MY_CONFIG = { apiKey: "AIzaSyBmhtGvkbvFmA7gOX02kW7ZWCA3VrEPQS0", authDomain: "belohnung-6be28.firebaseapp.com", projectId: "belohnung-6be28", storageBucket: "belohnung-6be28.firebasestorage.app", messagingSenderId: "438643009599", appId: "1:438643009599:web:c91d720794a5cbd1dfb08a" };
        const PIN = "8458";
        const UNLOCK_DURATION = 3 * 60 * 1000;
        
        const DEFAULT_TASKS_POOL = [
            { name: '1 kleine Aufgaben 📝', points: 0.5 }, { name: 'Bäder putzen 🛁', points: 2 }, { name: 'Cosmo Gassi gehen 🐕', points: 1.5 }, { name: 'Eingang Schuhe Schulzeug 👟', points: 0.5 }, { name: 'Esstisch abräumen und putzen 🧽', points: 0.5 }, { name: 'Fenster putzen 🪟', points: 2 }, { name: 'Hausaufgaben 📚', points: 0.5 }, { name: 'Kochen helfen 🍳', points: 1.5 }, { name: 'Küche aufräumen 🍳', points: 1 }, { name: 'Meerschweinchen füttern 🐹', points: 0.5 }, { name: 'Meerschweinchen misten 🐹', points: 7 }, { name: 'Müll rausbringen 🗑️', points: 0.5 }, { name: 'Pflanzen gießen 🪴', points: 0.5 }, { name: 'Sofa aufräumen 🛋️', points: 0.5 }, { name: 'Spülmaschine ausräumen 🍽️', points: 1 }, { name: 'Staubsaugen 🧹', points: 1.5 }, { name: 'Tisch abräumen/decken 🍽️', points: 0.5 }, { name: 'Tischen 🍽️', points: 0.5 }, { name: 'Treppen saugen & aufnehmen 🪜', points: 2 }, { name: 'Wäsche waschen 🧺', points: 1 }, { name: 'Wäsche zusammenlegen 👕', points: 2 }, { name: 'Zimmer aufräumen 🧸', points: 1 }
        ];

        const DEFAULT_DAILY_TASKS = [
            { id: 'mf1', label: 'Meerschweinchen (Morgen)', baseTask: 'Meerschweinchen füttern 🐹', type: 'shared', kidId: 0, emoji: '🐹🌅' },
            { id: 'mf2', label: 'Meerschweinchen (Abend)', baseTask: 'Meerschweinchen füttern 🐹', type: 'shared', kidId: 0, emoji: '🐹🌙' },
            { id: 'em', label: 'Esstisch abräumen Mittag', baseTask: 'Esstisch abräumen und putzen 🧽', type: 'shared', kidId: 0, emoji: '🧽☀️' },
            { id: 'ea', label: 'Esstisch abräumen Abend', baseTask: 'Esstisch abräumen und putzen 🧽', type: 'shared', kidId: 0, emoji: '🧽🌙' },
            { id: 'ei', label: 'Eingang aufräumen', baseTask: 'Eingang Schuhe Schulzeug 👟', type: 'shared', kidId: 0, emoji: '👟🚪' },
            { id: 'tm', label: 'Tisch decken Mittag', baseTask: 'Tischen 🍽️', type: 'shared', kidId: 0, emoji: '🍽️☀️' },
            { id: 'ta', label: 'Tisch decken Abend', baseTask: 'Tischen 🍽️', type: 'shared', kidId: 0, emoji: '🍽️🌙' },
            { id: 'so', label: 'Sofa aufräumen', baseTask: 'Sofa aufräumen 🛋️', type: 'shared', kidId: 0, emoji: '🛋️✨' },
            { id: 'hl', label: 'Hausaufgaben', baseTask: 'Hausaufgaben 📚', type: 'individual', kidId: 1, emoji: '📚✍️' },
            { id: 'hn', label: 'Hausaufgaben', baseTask: 'Hausaufgaben 📚', type: 'individual', kidId: 0, emoji: '📚✍️' } 
        ];

        let state = { kids: [], tasks: [], dailyTasksConfig: [], history: [], dailyState: { date: '', completed: [] }, pin: PIN };

        const isSandbox = typeof __firebase_config !== 'undefined' && __firebase_config;
        const config = isSandbox ? JSON.parse(__firebase_config) : MY_CONFIG;
        const app = initializeApp(config);
        const db = getFirestore(app);
        let auth = null, user = null;
        if (isSandbox) auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let lastUnlockTime = 0, currentPin = "", pendingAction = null, firebaseReady = false;

        const openModal = (id) => document.getElementById(id).classList.add('active');
        const closeModal = (id) => document.getElementById(id).classList.remove('active');
        const showMessage = (t) => { const b = document.getElementById('message-box'); b.innerText = t; b.style.display = 'block'; setTimeout(() => { b.style.display = 'none'; }, 3000); };
        const setStatus = (s) => { const d = document.getElementById('status-dot'); if(d) d.style.background = s === 'online' ? '#22c55e' : (s === 'connecting' ? '#eab308' : '#ef4444'); };
        const getTodayStr = () => new Date().toISOString().split('T')[0];

        window.openModal = openModal;
        window.closeModal = closeModal;

        window.switchTab = (event, tabId) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        };

        // REPARATUR-LOGIK FÜR EMOJIS
        window.getSafeEmoji = function(taskObj) {
            const isVisible = (str) => { if (!str) return false; return str.replace(/[\uFE0E\uFE0F\s]/g, '').length > 0; };
            if (isVisible(taskObj.emoji)) return taskObj.emoji.trim();
            if (taskObj.baseTask) {
                const match = taskObj.baseTask.match(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu);
                if (match && match.length > 0) return match.join('');
            }
            if (taskObj.id.includes('mf')) return '🐹';
            if (taskObj.id.includes('em') || taskObj.id.includes('ea')) return '🧽';
            if (taskObj.id.includes('ei')) return '👟';
            if (taskObj.id.includes('tm') || taskObj.id.includes('ta')) return '🍽️';
            if (taskObj.id.includes('so')) return '🛋️';
            return '✨';
        };

        function triggerFlyingStarAnimation(kidId, points, taskName, callback) {
            const wrapper = document.createElement('div');
            wrapper.style.cssText = "position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle, rgba(15,23,42,0.8) 0%, transparent 100%); pointer-events:none;";
            wrapper.innerHTML = `<div style="text-align:center;"><div style="font-size:6rem; transform:rotate(-15deg);">⭐</div><div style="font-size:3rem; font-weight:900; color:#facc15;">+${points}</div><div style="color:white;font-weight:bold;font-size:1.5rem;margin-top:10px;">${taskName}</div></div>`;
            document.body.appendChild(wrapper);
            confetti({ particleCount: 150, spread: 150, origin: { y: 0.5 } });
            setTimeout(() => { wrapper.remove(); callback(); }, 2200);
        }

        async function initSync() {
            setStatus('connecting');
            try {
                if (isSandbox) {
                    const initAuth = async () => {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                        else await signInAnonymously(auth);
                    };
                    await initAuth();
                    onAuthStateChanged(auth, (u) => { user = u; if (user) startFirestore(); });
                } else { startFirestore(); }
            } catch (e) { console.error("Firebase Init Error:", e); setStatus('offline'); document.getElementById('loading-screen').style.display = 'none'; }
        }

        function startFirestore() {
            if (firebaseReady) return;
            firebaseReady = true;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'sync', 'state');
            onSnapshot(docRef, (docSnap) => {
                document.getElementById('loading-screen').style.display = 'none';
                setStatus('online');
                if (docSnap.exists()) {
                    state = docSnap.data();
                    // Auto-Reparatur für bekannte Aufgaben
                    if (state.dailyTasksConfig) {
                        state.dailyTasksConfig.forEach(dt => {
                            const def = DEFAULT_DAILY_TASKS.find(d => d.id === dt.id);
                            if (def && (!dt.emoji || [...dt.emoji].length < 2)) dt.emoji = def.emoji;
                        });
                    }
                    if (!state.dailyState) state.dailyState = { date: getTodayStr(), completed: [] };
                    if (state.dailyState.date !== getTodayStr()) { state.dailyState.date = getTodayStr(); state.dailyState.completed = []; }
                    render();
                } else {
                    state.kids = [{ id: 0, name: 'Noelle', icon: '🦄', count: 0, ackTens: 0, sGoal: '1h Gamen/TV', bGoal: '20.- / Shoppen', megaGoal: 'Europa-Park', valSmall: 10, valBig: 100, valMega: 300 }, { id: 1, name: 'Levi', icon: '🚀', count: 0, ackTens: 0, sGoal: '1h Gamen/TV', bGoal: '20.- / Shoppen', megaGoal: 'Trampolinpark', valSmall: 10, valBig: 100, valMega: 300 }];
                    state.tasks = [...DEFAULT_TASKS_POOL];
                    state.dailyTasksConfig = [...DEFAULT_DAILY_TASKS];
                    state.dailyState = { date: getTodayStr(), completed: [] };
                    setDoc(docRef, state);
                    render();
                }
            }, (err) => { setStatus('offline'); document.getElementById('loading-screen').style.display = 'none'; render(); });
        }

        async function syncToCloud() {
            if (!firebaseReady || (isSandbox && !user)) return;
            try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sync', 'state'), state); } catch (e) { setStatus('offline'); }
        }

        window.claimDailyTask = (taskId, kidId) => {
            const kidsCompletedTasks = state.dailyState.completed.filter(c => c.kidId === kidId).length;
            if (kidsCompletedTasks >= 5) return showMessage("Limit erreicht! 🛑");
            const dt = state.dailyTasksConfig.find(t => t.id === taskId);
            const pts = (state.tasks.find(x => x.name === dt.baseTask) || {points: 0.5}).points;
            triggerFlyingStarAnimation(kidId, pts, dt.label, () => {
                const kid = state.kids.find(k => k.id === kidId);
                kid.count = Math.round((kid.count + pts) * 10) / 10;
                state.dailyState.completed.push({ taskId, kidId, points: pts, name: dt.label, timestamp: Date.now() });
                state.history.push({ kidName: kid.name, points: pts, taskName: `Tagesaufgabe: ${dt.label}`, timestamp: Date.now() });
                render(); syncToCloud();
            });
        };

        window.undoLastDailyTask = (kidId) => {
            const idx = state.dailyState.completed.map(c => c.kidId).lastIndexOf(kidId);
            if (idx === -1) return showMessage("Nichts zum Rückgängig machen.");
            const task = state.dailyState.completed.splice(idx, 1)[0];
            const kid = state.kids.find(k => k.id === kidId);
            kid.count = Math.max(0, Math.round((kid.count - task.points) * 10) / 10);
            const step = kid.valSmall || 10;
            if (kid.ackTens > Math.floor(kid.count / step)) kid.ackTens = Math.floor(kid.count / step);
            render(); syncToCloud(); showMessage("Rückgängig gemacht! ⏪");
        };

        window.openDailyTaskDetails = (taskId, kidId) => {
            const dt = state.dailyTasksConfig.find(t => t.id === taskId);
            const pts = (state.tasks.find(x => x.name === dt.baseTask) || {points: 0.5}).points;
            document.getElementById('dd-emoji').innerText = window.getSafeEmoji(dt);
            document.getElementById('dd-title').innerText = dt.label;
            document.getElementById('dd-pts').innerText = `+${pts} ⭐`;
            document.getElementById('dd-confirm-btn').onclick = () => { closeModal('daily-detail-modal'); window.checkPin(() => window.claimDailyTask(taskId, kidId)); };
            openModal('daily-detail-modal');
        };

        function generateDailyHtml(kid) {
            const completedIds = state.dailyState.completed.map(c => c.taskId);
            const available = state.dailyTasksConfig.filter(t => !completedIds.includes(t.id) && (t.type === 'shared' || t.kidId === kid.id));
            let html = `<div class="daily-dashboard"><div class="daily-header"><div><h3>📅 Tagesaufgaben</h3><span class="current-datetime" style="font-size:0.6rem;color:#94a3b8;"></span></div><button class="btn-undo" onclick="window.checkPin(() => window.undoLastDailyTask(${kid.id}))">↺</button></div><div class="daily-scroll-container"><div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">`;
            if (available.length === 0) html += `<div class="daily-empty" style="grid-column: span 2;">Alle erledigt! 🎉</div>`;
            else available.forEach(t => {
                const pts = (state.tasks.find(x => x.name === t.baseTask) || {points: 0.5}).points;
                html += `<div class="daily-item" onclick="window.openDailyTaskDetails('${t.id}', ${kid.id})" style="flex-direction:column; height:80px;"><span style="font-size:1.8rem;line-height:1;">${window.getSafeEmoji(t)}</span><span class="daily-pts">+${pts}</span></div>`;
            });
            return html + `</div></div></div>`;
        }

        function generateKidHtml(k) {
            const step = k.valSmall || 10;
            const count = Math.round((k.count || 0) * 10) / 10;
            const unclaimed = Math.floor((count - (k.ackTens * step)) / step);
            const nextTarget = (k.ackTens + 1) * step;
            const progSmall = Math.min(100, (count / nextTarget) * 100);
            const progBig = Math.min(100, (count / (k.valBig || 100)) * 100);
            const progMega = Math.min(100, (count / (k.valMega || 300)) * 100);
            
            let tally = '';
            if (k.ackTens > 0) tally += `<div style="display:flex;gap:5px;align-items:center;"><span style="font-size:2rem;">🏆</span><span style="font-weight:900;color:var(--gold);">x${k.ackTens}</span></div>`;
            const visualStars = Math.floor(count % step);
            for(let i=0; i<visualStars; i++) tally += `<div class="star-icon" style="opacity:1; transform:scale(1);">⭐</div>`;
            if (unclaimed > 0) tally = `<button class="btn-claim" onclick="window.acknowledgeTen(${k.id})">🎁 Belohnung abholen!</button>`;

            return `<div class="kid-card theme-${k.id}"><div class="kid-header"><div class="kid-info-box"><div class="avatar-btn" onclick="window.openIconPicker(${k.id})">${k.icon}</div><div><h2>${k.name}</h2><div class="total-score-badge">${count} ⭐</div></div></div><button class="btn-kid-reset" onclick="window.checkPin(()=>window.resetKid(${k.id}))">↺ Reset</button></div><div class="tally-box">${tally || '<span style="color:#475569;">Bereit für Sterne?</span>'}</div><div class="progress-section"><div class="progress-item"><div class="progress-label"><span>🎁 ${k.sGoal}</span><span class="stars-left">${Math.max(0, Math.round((nextTarget-count)*10)/10)} ⭐</span></div><div class="progress-bg"><div class="progress-fill fill-small" style="width:${progSmall}%"></div></div></div><div class="progress-item"><div class="progress-label"><span>🏆 ${k.bGoal}</span></div><div class="progress-bg"><div class="progress-fill fill-big" style="width:${progBig}%"></div></div></div><div class="progress-item"><div class="progress-label"><span>💎 ${k.megaGoal}</span></div><div class="progress-bg"><div class="progress-fill fill-mega" style="width:${progMega}%"></div></div></div></div><div class="controls"><button class="btn-action btn-minus" onclick="window.checkPin(()=>window.updateCount(${k.id},-0.5,'Abzug'))">-</button><button class="btn-action btn-plus" onclick="window.checkPin(()=>window.openAddPointsModal(${k.id}))">+</button></div></div>`;
        }

        function render() {
            const main = document.getElementById('main-layout'); main.innerHTML = '';
            state.kids.forEach((k, i) => {
                const side = i % 2 === 0 ? 'left' : 'right';
                const group = document.createElement('div'); group.className = `kid-group kid-group-${side}`;
                if (side === 'left') group.innerHTML = generateKidHtml(k) + generateDailyHtml(k);
                else group.innerHTML = generateDailyHtml(k) + generateKidHtml(k);
                main.appendChild(group);
            });
            updateClock();
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
            const dateStr = now.toLocaleDateString('de-CH', { weekday: 'short', day: '2-digit', month: '2-digit' });
            document.querySelectorAll('.current-datetime').forEach(el => el.innerHTML = `${dateStr}<br>${timeStr}`);
        }
        setInterval(updateClock, 1000);

        // PIN & AUTH Logik (vereinfacht für v5.1)
        window.checkPin = (a) => { if (Date.now() - lastUnlockTime < UNLOCK_DURATION) a(); else { pendingAction = a; currentPin = ""; updatePinDots(); openModal('pin-modal'); } };
        function updatePinDots() { document.querySelectorAll('.dot').forEach((d, i) => d.style.background = i < currentPin.length ? 'var(--blue)' : 'none'); }
        const pad = document.getElementById('pin-pad');
        ["1","2","3","4","5","6","7","8","9","C","0","OK"].forEach(v => {
            const b = document.createElement('button'); b.className = "btn-action"; b.innerText = v; b.style.height="60px"; b.style.fontSize="1.5rem";
            b.onclick = () => {
                if(v === "C") { currentPin = ""; updatePinDots(); }
                else if(v !== "OK" && currentPin.length < 4) {
                    currentPin += v; updatePinDots();
                    if(currentPin.length === 4) {
                        if(currentPin === (state.pin || PIN)) { lastUnlockTime = Date.now(); if(pendingAction) pendingAction(); closeModal('pin-modal'); updateUnlockDisplay(); }
                        else { currentPin = ""; updatePinDots(); showMessage("Falsch! ❌"); }
                    }
                }
            };
            pad.appendChild(b);
        });

        function updateUnlockDisplay() {
            const c = document.getElementById('unlock-status-container');
            if (Date.now() - lastUnlockTime < UNLOCK_DURATION) {
                c.innerHTML = `<span style="color:#fbbf24; font-size:0.7rem;">🔓 Offen</span>`;
                setTimeout(updateUnlockDisplay, 1000);
            } else c.innerHTML = "";
        }

        window.updateCount = (id, v, n) => {
            const k = state.kids.find(x => x.id === id);
            k.count = Math.max(0, Math.round((k.count + v) * 10) / 10);
            const step = k.valSmall || 10;
            if (k.ackTens > Math.floor(k.count / step)) k.ackTens = Math.floor(k.count / step);
            state.history.push({ kidName: k.name, points: v, taskName: n, timestamp: Date.now() });
            render(); syncToCloud();
        };

        window.openConfig = () => {
            const c = document.getElementById('config-kids-fields');
            c.innerHTML = state.kids.map(k => `<div class="config-card"><label>${k.name}</label><input id="cn-${k.id}" value="${k.name}"><div style="display:grid;grid-template-columns:3fr 1fr;gap:5px;"><input id="cs-${k.id}" value="${k.sGoal}"> <input type="number" id="v1-${k.id}" value="${k.valSmall}"></div></div>`).join('');
            window.renderDailyTasksConfig();
            window.renderTasksConfig();
            openModal('config-modal');
        };

        window.renderDailyTasksConfig = () => {
            const container = document.getElementById('config-daily-tasks-fields');
            container.innerHTML = state.dailyTasksConfig.map((dt, i) => `
                <div class="config-card">
                    <div style="display:flex; gap:5px;"><input id="dtl-${i}" value="${dt.label}"><input id="dte-${i}" value="${dt.emoji || ''}" style="width:70px;text-align:center;"><button onclick="window.removeDailyTaskConfig(${i})">🗑</button></div>
                    <select id="dtb-${i}">${state.tasks.map(t => `<option value="${t.name}" ${dt.baseTask === t.name ? 'selected' : ''}>${t.name}</option>`).join('')}</select>
                </div>`).join('');
        };
        
        window.renderTasksConfig = () => {
            document.getElementById('config-tasks-fields').innerHTML = state.tasks.map((t, i) => `<div style="display:flex;gap:5px;margin-bottom:5px;"><input id="tn-${i}" value="${t.name}"><input type="number" step="0.5" id="tp-${i}" value="${t.points}" style="width:60px;"><button onclick="state.tasks.splice(${i},1);renderTasksConfig();">🗑</button></div>`).join('');
        };

        window.saveConfig = () => {
            state.kids.forEach(k => { k.name = document.getElementById(`cn-${k.id}`).value; k.sGoal = document.getElementById(`cs-${k.id}`).value; k.valSmall = parseInt(document.getElementById(`v1-${k.id}`).value); });
            state.dailyTasksConfig.forEach((dt, i) => { dt.label = document.getElementById(`dtl-${i}`).value; dt.emoji = document.getElementById(`dte-${i}`).value; dt.baseTask = document.getElementById(`dtb-${i}`).value; });
            const p = document.getElementById('system-pin-input').value; if(p && p.length===4) state.pin = p;
            closeModal('config-modal'); render(); syncToCloud(); showMessage("Gespeichert! 💾");
        };

        window.loadDefaultTasks = () => { 
            state.dailyTasksConfig = [...DEFAULT_DAILY_TASKS]; 
            DEFAULT_TASKS_POOL.forEach(d => { if(!state.tasks.some(t => t.name === d.name)) state.tasks.push(d); });
            window.renderDailyTasksConfig(); window.renderTasksConfig(); showMessage("Emojis & Standards repariert! 🐹");
        };

        initSync();
    </script>
</body>
</html>
