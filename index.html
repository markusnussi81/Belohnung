<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kids Star Tracker Pro</title>
    <style>
        /* PURES CSS - KEINE EXTERNEN QUELLEN ERFORDERLICH */
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --blue: #38bdf8;
            --gold: #fbbf24;
            --pink: #ec4899;
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        header { text-align: center; padding: 20px 0; }
        h1 { 
            font-size: 3rem; 
            margin: 0; 
            background: linear-gradient(to right, var(--blue), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }

        #motivation-text { color: var(--blue); font-style: italic; margin-top: 10px; min-height: 24px; }

        .kids-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        @media (min-width: 700px) { .kids-grid { grid-template-columns: 1fr 1fr; } }

        .kid-card {
            background: var(--card);
            border-radius: 40px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
        }

        .kid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .avatar { font-size: 60px; }
        .kid-info h2 { margin: 0; font-size: 2rem; }
        .kid-info p { margin: 0; color: var(--blue); font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }

        .tally-box {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            min-height: 100px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tally {
            width: 8px;
            height: 45px;
            background: var(--blue);
            border-radius: 4px;
            transform: rotate(-5deg);
        }
        .tally.gold {
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold);
            height: 50px;
        }

        .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        
        button {
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        .btn-minus { background: #334155; color: #94a3b8; height: 80px; }
        .btn-plus { background: linear-gradient(to bottom right, #0ea5e9, #6366f1); color: white; height: 80px; }

        .progress-section { margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; }
        .progress-bg { background: #0f172a; height: 12px; border-radius: 6px; overflow: hidden; }
        .progress-fill { background: linear-gradient(to right, var(--blue), var(--pink)); height: 100%; transition: width 0.5s; }

        /* Navigation */
        .toolbar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 50px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-tool { background: none; color: #94a3b8; font-size: 1rem; }
        .btn-reset { color: #f87171; }

        /* Modals */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal.active { display: flex; }

        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 350px; width: 100%; }
        .btn-key { background: #1e293b; color: white; height: 80px; font-size: 2rem; border-radius: 20px; }
        .pin-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 20px; height: 20px; border: 3px solid #334155; border-radius: 50%; }
        .dot.filled { background: var(--blue); border-color: var(--blue); }

        .config-card { background: #1e293b; width: 100%; max-width: 500px; padding: 30px; border-radius: 30px; }
        .config-card input { width: 100%; padding: 15px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 10px; font-size: 1rem; }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <h1>STAR TRACKER</h1>
            <div id="motivation-text">Lade Sprüche...</div>
        </header>
        <div id="kids-container" class="kids-grid"></div>
    </div>

    <div class="toolbar">
        <button class="btn-tool" onclick="openConfig()">⚙️ SETTINGS</button>
        <button class="btn-tool btn-reset" onclick="askPin(() => resetSystem())">🔄 RESET ALL</button>
    </div>

    <div id="pin-modal" class="modal">
        <h2 style="font-size: 2rem; margin-bottom: 10px;">Security Code</h2>
        <div class="pin-dots" id="pin-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="pin-grid" id="pin-pad"></div>
        <button onclick="closePin()" style="margin-top: 30px; background: none; color: #64748b; font-size: 1rem;">Abbrechen</button>
    </div>

    <div id="config-modal" class="modal">
        <div class="config-card">
            <h2 style="margin-top: 0;">Einstellungen</h2>
            <div id="config-fields"></div>
            <button onclick="saveConfig()" style="width: 100%; background: var(--blue); color: white; padding: 20px; border-radius: 20px; font-size: 1.5rem; margin-top: 20px;">SPEICHERN</button>
            <button onclick="closeConfig()" style="width: 100%; background: none; color: #64748b; margin-top: 10px; font-size: 1rem;">Schließen</button>
        </div>
    </div>

    <script>
        const PIN = "8458";
        let currentPin = "";
        let pendingAction = null;

        let state = JSON.parse(localStorage.getItem('stars_standalone_v1')) || {
            kids: [
                { id: 0, name: 'Noelle', icon: '🦄', sGoal: 'Eis essen', bGoal: 'Disneyland', count: 0 },
                { id: 1, name: 'Levi', icon: '🚀', sGoal: 'Lego Set', bGoal: 'Abenteuerpark', count: 0 }
            ]
        };

        const quotes = ["Du bist spitze!", "Weiter so!", "Fast geschafft!", "Strich für Strich zum Ziel!", "Super fleißig!"];

        function render() {
            const container = document.getElementById('kids-container');
            container.innerHTML = '';
            
            const lowKid = [...state.kids].sort((a,b) => a.count - b.count)[0];
            document.getElementById('motivation-text').innerText = state.kids[0].count !== state.kids[1].count ? 
                lowKid.name + ": " + quotes[Math.floor(Math.random() * quotes.length)] : "Alle sind heute Superstars!";

            state.kids.forEach(k => {
                const currentBlock = k.count % 10 || (k.count > 0 ? 10 : 0);
                let tallies = '';
                for(let i=1; i<=currentBlock; i++) {
                    tallies += `<div class="tally ${i === 10 ? 'gold' : ''}"></div>`;
                }

                container.innerHTML += `
                    <div class="kid-card">
                        <div class="kid-header">
                            <div class="kid-info">
                                <h2>${k.name}</h2>
                                <p>${k.sGoal}</p>
                            </div>
                            <div class="avatar">${k.icon}</div>
                        </div>
                        <div class="tally-box">${tallies || 'Los geht\'s!'}</div>
                        <div class="controls">
                            <button class="btn-minus" onclick="askPin(()=>update(${k.id},-1))">-</button>
                            <button class="btn-plus" onclick="askPin(()=>update(${k.id},1))">+</button>
                        </div>
                        <div class="progress-section">
                            <div class="progress-label">
                                <span>Ziel: ${k.bGoal}</span>
                                <span>${k.count}/100</span>
                            </div>
                            <div class="progress-bg">
                                <div class="progress-fill" style="width: ${Math.min(100, k.count)}%"></div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function update(id, val) {
            const kid = state.kids.find(k => k.id === id);
            kid.count = Math.max(0, kid.count + val);
            save();
        }

        function save() {
            localStorage.setItem('stars_standalone_v1', JSON.stringify(state));
            render();
        }

        // PIN Logic
        function askPin(action) {
            pendingAction = action;
            currentPin = "";
            updatePinDots();
            document.getElementById('pin-modal').classList.add('active');
        }
        function closePin() { document.getElementById('pin-modal').classList.remove('active'); }

        function pressKey(k) {
            if(currentPin.length < 4) {
                currentPin += k;
                updatePinDots();
                if(currentPin.length === 4) {
                    setTimeout(() => {
                        if(currentPin === PIN) { if(pendingAction) pendingAction(); closePin(); }
                        else { currentPin = ""; updatePinDots(); alert("Falscher Code!"); }
                    }, 100);
                }
            }
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((d, i) => d.className = i < currentPin.length ? 'dot filled' : 'dot');
        }

        // Build Pin Pad
        const pad = document.getElementById('pin-pad');
        ["1","2","3","4","5","6","7","8","9","C","0","OK"].forEach(k => {
            const b = document.createElement('button');
            b.className = "btn-key";
            b.innerText = k;
            b.onclick = () => k === "C" ? (currentPin="", updatePinDots()) : (k !== "OK" ? pressKey(k) : null);
            pad.appendChild(b);
        });

        // Config Logic
        function openConfig() {
            const fields = document.getElementById('config-fields');
            fields.innerHTML = state.kids.map(k => `
                <div style="margin-bottom: 20px;">
                    <label style="color: var(--blue); font-weight: bold;">${k.name}</label>
                    <input id="s-${k.id}" value="${k.sGoal}" placeholder="10er Ziel">
                    <input id="b-${k.id}" value="${k.bGoal}" placeholder="100er Ziel">
                </div>
            `).join('');
            document.getElementById('config-modal').classList.add('active');
        }
        function saveConfig() {
            state.kids.forEach(k => {
                k.sGoal = document.getElementById(`s-${k.id}`).value;
                k.bGoal = document.getElementById(`b-${k.id}`).value;
            });
            closeConfig();
            save();
        }
        function closeConfig() { document.getElementById('config-modal').classList.remove('active'); }
        function resetSystem() { if(confirm("ALLES löschen?")) { state.kids.forEach(k => k.count = 0); save(); } }

        window.onload = render;
    </script>
</body>
</html>
