<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- App/Vollbild Meta-Tags für iOS (iPad/iPhone) und Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Star Tracker">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e1b4b">
    
    <title>Kids Star Tracker Pro v2.2</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js" crossorigin="anonymous"></script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Kinderfreundliche Schriftart -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --blue: #38bdf8;
            --blue-glow: rgba(56, 189, 248, 0.5);
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.6);
            --pink: #f472b6;
            --pink-glow: rgba(244, 114, 182, 0.5);
            --green: #4ade80;
            --purple: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.5);
            --text: #ffffff;
            --success: #22c55e;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 10px; }

        body {
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            background: var(--bg-gradient);
            color: var(--text);
            font-family: 'Baloo 2', cursive, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        header { text-align: center; padding: 15px 0 10px 0; }
        h1 { 
            font-size: 2.8rem; 
            margin: 0; 
            background: linear-gradient(to right, #fbbf24, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
            font-weight: 800;
        }

        .version-bar {
            display: flex; justify-content: center; align-items: center; gap: 8px;
            font-size: 0.9rem; color: #94a3b8; font-weight: bold; margin-top: 5px; letter-spacing: 1px;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444; transition: all 0.3s ease;
        }

        .btn-info {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--blue);
            color: var(--blue);
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Baloo 2';
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
            transition: all 0.2s;
        }
        .btn-info:active { transform: scale(0.95); }

        .kids-grid { display: grid; grid-template-columns: 1fr; gap: 25px; margin-top: 15px; }
        @media (min-width: 700px) { .kids-grid { grid-template-columns: 1fr 1fr; } }

        .kid-card {
            background: var(--card-bg);
            border-radius: 35px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
        }

        .kid-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .kid-info h2 { margin: 0; font-size: 2.2rem; font-weight: 800; line-height: 1.1; }
        
        .btn-kid-reset {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        .avatar-btn { 
            font-size: 75px; 
            background: rgba(255,255,255,0.08); 
            border-radius: 25px; 
            padding: 10px; 
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(3deg); } 100% { transform: translateY(0px) rotate(0deg); } }

        .goals-container { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .goal-pill { 
            display: flex; align-items: center; gap: 6px; padding: 5px 12px; 
            border-radius: 18px; font-size: 0.85rem; font-weight: 700; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }
        .small-goal { 
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.3), rgba(244, 114, 182, 0.6)); 
            border-color: rgba(244, 114, 182, 0.5); 
            color: #fff1f2; 
        }
        .big-goal { 
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.3), rgba(251, 191, 36, 0.6)); 
            border-color: rgba(251, 191, 36, 0.5); 
            color: #fffbeb; 
        }
        .mega-goal { 
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(168, 85, 247, 0.6)); 
            border-color: rgba(168, 85, 247, 0.5); 
            color: #faf5ff; 
        }

        .tally-box {
            position: relative;
            background: rgba(0,0,0,0.45);
            border-radius: 25px;
            min-height: 110px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .star-icon {
            font-size: 2.2rem;
            color: var(--gold);
            text-shadow: 0 0 12px var(--gold-glow);
            animation: popStar 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: scale(0);
        }
        @keyframes popStar { to { opacity: 1; transform: scale(1) rotate(360deg); } }

        .celebration-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(5px);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            animation: pulseOverlay 2s infinite;
            border: 3px solid var(--gold);
        }
        @keyframes pulseOverlay {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

        .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        .btn-action {
            border: none; border-radius: 25px; font-weight: 800; font-size: 2.5rem; cursor: pointer; height: 75px;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.95); }
        .btn-minus { background: #334155; color: #94a3b8; }
        .btn-plus { 
            background: linear-gradient(135deg, #0ea5e9, #6366f1, #d946ef); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.2);
        }

        .progress-section { margin-top: 25px; display: flex; flex-direction: column; gap: 12px; }
        .progress-item { width: 100%; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #cbd5e1; font-weight: 700; margin-bottom: 4px; }
        .progress-bg { background: rgba(0,0,0,0.5); height: 16px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .progress-fill { 
            height: 100%; transition: width 0.8s ease; 
            background-size: 30px 30px;
            background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent);
            animation: moveStripes 2s linear infinite;
        }
        @keyframes moveStripes { from { background-position: 0 0; } to { background-position: 30px 0; } }
        
        .fill-small { background-color: var(--pink); box-shadow: 0 0 10px var(--pink-glow); }
        .fill-big { background-color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
        .fill-mega { background-color: var(--purple); box-shadow: 0 0 10px var(--purple-glow); }

        .toolbar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px;
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(15px); padding: 15px; border-radius: 40px;
            display: flex; justify-content: center; align-items: center; z-index: 50; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .toolbar-btn { background:none; color:white; font-weight:800; border:none; cursor:pointer; font-size: 1.1rem; font-family:'Baloo 2'; flex: 1; }

        .modal {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content-scroll {
            background: var(--card-bg); width: 100%; max-width: 450px; max-height: 85vh; padding: 25px; 
            border-radius: 35px; border: 1px solid rgba(255,255,255,0.1); overflow-y: auto; position: relative;
        }

        .btn-close-top {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white;
            border: none; width: 35px; height: 35px; border-radius: 50%; font-weight: bold; cursor: pointer;
        }

        .tasks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .task-btn-item {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15); padding: 12px 10px; border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; gap: 6px;
        }
        .task-btn-points { background: var(--gold); color: #000; padding: 3px 10px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; }

        .edit-task-row { display: grid; grid-template-columns: 3fr 1fr 40px; gap: 10px; align-items: center; margin-bottom: 10px; }
        .config-card { margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .config-card input { width: 100%; padding: 12px; margin: 5px 0 12px 0; background: rgba(0,0,0,0.3); border: 1px solid #475569; color: white; border-radius: 15px; font-family: 'Baloo 2'; }
        
        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 320px; }
        .btn-key { background: rgba(255,255,255,0.05); color: white; height: 75px; font-size: 2rem; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-family: 'Baloo 2'; font-weight: 800; }
        .pin-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 20px; height: 20px; border: 2px solid #64748b; border-radius: 50%; }
        .dot.filled { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 10px var(--blue); }

        #loading-screen { position: fixed; inset: 0; background: var(--bg-gradient); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 60px; height: 60px; border: 6px solid rgba(56, 189, 248, 0.2); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: var(--blue); font-weight: bold;">Lade bunte Sterne...</p>
    </div>

    <div id="message-box" style="position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--card-bg); padding: 15px 30px; border-radius: 25px; border: 2px solid var(--blue); z-index: 2000; display: none;"></div>

    <div id="app">
        <header>
            <h1>STAR TRACKER</h1>
            <div class="version-bar">
                <span>v2.2</span>
                <div id="status-dot" class="status-dot"></div>
            </div>
            <div id="unlock-status-container" style="min-height: 30px; margin-top: 5px;"></div>
            <button class="btn-info" onclick="openTasksInfoModal()">📋 Aufgaben & Ziele</button>
        </header>
        <div id="kids-container" class="kids-grid"></div>
    </div>

    <div class="toolbar">
        <button class="toolbar-btn" onclick="openHistoryModal()">📜 HISTORIE</button>
        <div style="width: 2px; height: 30px; background: rgba(255,255,255,0.2); margin: 0 10px; border-radius: 2px;"></div>
        <button class="toolbar-btn" onclick="checkPin(() => openConfig())">⚙️ SETTINGS</button>
    </div>

    <!-- Modals -->
    <div id="pin-modal" class="modal">
        <h2 style="font-size: 2.5rem; margin-bottom: 5px;">Geheimcode</h2>
        <div class="pin-dots" id="pin-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        <div class="pin-grid" id="pin-pad"></div>
        <button onclick="closeModal('pin-modal')" style="margin-top: 20px; background: none; color: #94a3b8; border:none; cursor:pointer;">Abbrechen</button>
    </div>

    <div id="add-points-modal" class="modal">
        <div class="modal-content-scroll">
            <button class="btn-close-top" onclick="closeModal('add-points-modal')">X</button>
            <h2 id="add-points-title" style="text-align: center; color: var(--gold);">Sterne vergeben</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input id="custom-task-name" type="text" placeholder="Eigene Aufgabe..." style="flex: 1; padding: 12px; border-radius: 15px; border: 1px solid #475569; background: rgba(0,0,0,0.3); color: white;">
                <input id="custom-task-pts" type="number" step="0.5" placeholder="Pts" style="width: 70px; padding: 12px; border-radius: 15px; border: 1px solid #475569; background: rgba(0,0,0,0.3); color: white;">
                <button onclick="addCustomPoints()" style="background: var(--green); color: white; border: none; border-radius: 15px; padding: 0 15px;">OK</button>
            </div>
            <div id="add-tasks-list" class="tasks-grid"></div>
        </div>
    </div>

    <div id="config-modal" class="modal">
        <div class="modal-content-scroll">
            <button class="btn-close-top" onclick="closeModal('config-modal')">X</button>
            <h2 style="text-align: center; color: var(--blue);">Einstellungen</h2>
            <div id="config-kids-fields"></div>
            <h3 style="color: var(--gold); border-bottom: 1px solid rgba(255,255,255,0.1);">📋 Aufgaben-Editor</h3>
            <div id="config-tasks-fields"></div>
            <button onclick="loadDefaultTasks()" style="width:100%; padding:12px; border-radius:15px; background:rgba(56,189,248,0.1); color:var(--blue); border:1px solid var(--blue); margin-bottom:10px;">📋 Standardaufgaben laden</button>
            <button onclick="addNewTaskInput()" style="width:100%; padding:12px; border-radius:15px; background:none; color:white; border:1px dashed white; margin-bottom:20px;">+ Neue Aufgabe</button>
            <button onclick="saveConfig()" style="width:100%; padding:18px; border-radius:20px; background:var(--blue); color:white; font-weight:800; border:none;">SPEICHERN</button>
            <button onclick="checkPin(() => triggerResetSystem())" style="width:100%; padding:15px; border-radius:20px; background:linear-gradient(135deg, #ef4444, #b91c1c); color:white; font-weight:800; border:none; margin-top:20px;">⚠️ ZÄHLER AUF NULL</button>
        </div>
    </div>

    <div id="confirm-reset-modal" class="modal">
        <div class="modal-content-scroll" style="text-align: center;">
            <h2 style="color: #ef4444;">Punkte löschen?</h2>
            <p>Dies setzt die Zähler aller Kinder auf 0. Die Historie bleibt erhalten.</p>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="closeModal('confirm-reset-modal')" style="flex: 1; padding: 15px; border-radius: 15px; background: rgba(255,255,255,0.1); color: white; border:none;">Abbrechen</button>
                <button onclick="executeMasterReset()" style="flex: 1; padding: 15px; border-radius: 15px; background: #ef4444; color: white; border:none;">Löschen</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="modal"><div class="modal-content-scroll"><button class="btn-close-top" onclick="closeModal('history-modal')">X</button><h2>📜 Historie</h2><div id="history-list"></div></div></div>
    <div id="info-modal" class="modal"><div class="modal-content-scroll"><button class="btn-close-top" onclick="closeModal('info-modal')">X</button><h2>📋 Ziele & Aufgaben</h2><div id="info-goals-list"></div><br><div id="info-tasks-list" class="tasks-grid"></div></div></div>
    <div id="icon-modal" class="modal"><div class="modal-content-scroll"><h2>Wähle ein Icon</h2><div id="icon-grid" class="icon-grid"></div></div></div>

    <script>
        // CONFIG
        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyBmhtGvkbvFmA7gOX02kW7ZWCA3VrEPQS0",
            authDomain: "belohnung-6be28.firebaseapp.com",
            projectId: "belohnung-6be28",
            storageBucket: "belohnung-6be28.firebasestorage.app",
            messagingSenderId: "438643009599",
            appId: "1:438643009599:web:c91d720794a5cbd1dfb08a",
            measurementId: "G-4WRCVNC7GT"
        };
        const PIN = "8458";
        const UNLOCK_DURATION = 3 * 60 * 1000;
        const DEFAULT_TASKS_POOL = [
            { name: 'Cosmo Gassi gehen 🐕', points: 1.5 },
            { name: 'Zimmer aufräumen 🧸', points: 1.0 },
            { name: 'Hausaufgaben 📚', points: 1.5 },
            { name: 'Tisch abräumen/decken 🍽️', points: 0.5 },
            { name: 'Fenster putzen 🪟', points: 2.0 },
            { name: 'Kochen helfen 🍳', points: 1.5 },
            { name: 'Wäsche waschen 🧺', points: 1.0 },
            { name: 'Wäsche zusammenlegen 👕', points: 1.0 },
            { name: 'Spülmaschine ausräumen 🍽️', points: 1.0 },
            { name: 'Müll rausbringen 🗑️', points: 0.5 },
            { name: 'Staubsaugen 🧹', points: 1.5 },
            { name: 'Pflanzen gießen 🪴', points: 0.5 }
        ];

        let state = {
            kids: [
                { id: 0, name: 'Noelle', icon: '🦄', count: 0, ackTens: 0, sGoal: '1h Gamen/TV', bGoal: '20.- / Shoppen', megaGoal: 'Europa-Park', valSmall: 10, valBig: 100, valMega: 300 },
                { id: 1, name: 'Levi', icon: '🚀', count: 0, ackTens: 0, sGoal: '1h Gamen/TV', bGoal: '20.- / Shoppen', megaGoal: 'Trampolinpark', valSmall: 10, valBig: 100, valMega: 300 }
            ],
            tasks: DEFAULT_TASKS_POOL.map((t, i) => ({ ...t, id: i + 1 })),
            history: []
        };

        let lastUnlockTime = 0, currentPin = "", pendingAction = null, activeKidForIcon = null, activeKidForPoints = null;
        let auth = null, db = null, firebaseReady = false;

        const openModal = (id) => document.getElementById(id).classList.add('active');
        const closeModal = (id) => document.getElementById(id).classList.remove('active');
        const showMessage = (t) => { const b = document.getElementById('message-box'); b.innerText = t; b.style.display = 'block'; setTimeout(() => b.style.display = 'none', 3000); };
        const setStatus = (s) => { const d = document.getElementById('status-dot'); d.style.background = s === 'online' ? '#22c55e' : (s === 'connecting' ? '#eab308' : '#ef4444'); };

        async function initSync() {
            setStatus('connecting');
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : DEFAULT_FIREBASE_CONFIG;
            const appId = typeof __app_id !== 'undefined' ? __app_id : firebaseConfig.projectId;

            try {
                const app = firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await auth.signInWithCustomToken(__initial_auth_token);
                    } else {
                        await auth.signInAnonymously().catch(e => console.warn("Anonymous Auth Disabled:", e));
                    }
                };

                await initAuth();
                firebaseReady = true;

                const dbPath = `artifacts/${appId}/public/data/cloud_sync/state`;
                db.doc(dbPath).onSnapshot(doc => {
                    document.getElementById('loading-screen').style.display = 'none';
                    setStatus('online');
                    if (doc.exists) {
                        state = doc.data();
                        state.kids.forEach(k => { if(!k.valSmall){ k.valSmall=10; k.valBig=100; k.valMega=300; } });
                        render();
                    } else {
                        db.doc(dbPath).set(state);
                        render();
                    }
                }, err => { console.error("Firestore Listen Error:", err); setStatus('offline'); });
            } catch (e) { 
                console.error("Firebase Init Error:", e); 
                setStatus('offline'); 
                document.getElementById('loading-screen').style.display = 'none'; 
                render(); 
            }
        }

        async function syncToCloud() {
            if (!firebaseReady || !auth.currentUser) return;
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : DEFAULT_FIREBASE_CONFIG;
            const appId = typeof __app_id !== 'undefined' ? __app_id : firebaseConfig.projectId;
            const dbPath = `artifacts/${appId}/public/data/cloud_sync/state`;
            try { await db.doc(dbPath).set(state); } catch (e) { console.error("Sync Error:", e); setStatus('offline'); }
        }

        function updateCount(id, v, taskName) {
            const k = state.kids.find(x => x.id === id);
            const step = k.valSmall || 10;
            const oldTens = Math.floor(k.count / step);
            k.count = Math.max(0, Math.round((k.count + v) * 10) / 10);
            if (v > 0 && Math.floor(k.count / step) > oldTens) confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 } });
            state.history.push({ kidName: k.name, points: v, taskName, timestamp: Date.now() });
            if (state.history.length > 50) state.history.shift();
            render(); syncToCloud();
        }

        function acknowledgeTen(id) { state.kids.find(k => k.id === id).ackTens++; render(); syncToCloud(); }
        function resetKid(id) { const k = state.kids.find(x => x.id === id); k.count = k.ackTens * (k.valSmall || 10); render(); syncToCloud(); }
        function triggerResetSystem() { openModal('confirm-reset-modal'); }
        function executeMasterReset() { state.kids.forEach(k => { k.count = 0; k.ackTens = 0; }); closeModal('confirm-reset-modal'); closeModal('config-modal'); render(); syncToCloud(); showMessage("Reset durchgeführt! ✅"); }
        function manualLock() { lastUnlockTime = 0; updateUnlockDisplay(); showMessage("Gesperrt! 🔒"); }

        function render() {
            const container = document.getElementById('kids-container');
            container.innerHTML = '';
            state.kids.forEach(k => {
                const step = k.valSmall || 10;
                const big = k.valBig || 100;
                const mega = k.valMega || 300;
                const count = Math.round(k.count * 10) / 10;
                const currentTens = Math.floor(count / step);
                
                const progSmall = Math.min(100, ((count % step) / step) * 100);
                const progBig = Math.min(100, (count / big) * 100);
                const progMega = Math.min(100, (count / mega) * 100);
                
                let tallyHtml = '';
                if (currentTens > k.ackTens) {
                    for(let i=0;i<step;i++) tallyHtml += '<div class="star-icon" style="opacity:1;transform:scale(1)">⭐</div>';
                    tallyHtml += `<div class="celebration-overlay" onclick="acknowledgeTen(${k.id})"><div class="c-icon">🎁</div><div class="c-text">Geschafft!</div></div>`;
                } else {
                    const rem = Math.round((count % step) * 10) / 10;
                    if (rem === 0) tallyHtml = '<span style="color:rgba(255,255,255,0.4)">Noch 0 Sterne...</span>';
                    else {
                        for(let i=0; i<Math.floor(rem); i++) tallyHtml += '<div class="star-icon">⭐</div>';
                        if(rem % 1 !== 0) tallyHtml += '<div class="star-icon" style="opacity:0.6;font-size:1.5rem">🌟</div>';
                        tallyHtml += `<div style="width:100%;text-align:center;color:var(--gold);font-weight:800;font-size:0.8rem;">${rem} / ${step}</div>`;
                    }
                }

                container.innerHTML += `
                    <div class="kid-card">
                        <div class="kid-header"><h2>${k.name}</h2><button class="btn-kid-reset" onclick="checkPin(()=>resetKid(${k.id}))">↺ Reset</button></div>
                        <div class="goals-container">
                            <div class="goal-pill small-goal"><span>🎁 ${k.valSmall}:</span> <span>${k.sGoal}</span></div>
                            <div class="goal-pill big-goal"><span>🏆 ${k.valBig}:</span> <span>${k.bGoal}</span></div>
                            <div class="goal-pill mega-goal"><span>💎 ${k.valMega}:</span> <span>${k.megaGoal}</span></div>
                        </div>
                        <div style="display:flex;align-items:center;gap:20px;margin-bottom:20px;">
                             <div class="avatar-btn" onclick="openIconPicker(${k.id})">${k.icon}</div>
                             <div class="tally-box" style="flex:1;margin-bottom:0;">${tallyHtml}</div>
                        </div>
                        <div class="controls">
                            <button class="btn-action btn-minus" onclick="checkPin(()=>updateCount(${k.id}, -0.5, 'Abzug'))">-</button>
                            <button class="btn-action btn-plus" onclick="checkPin(()=>openAddPointsModal(${k.id}))">+</button>
                        </div>
                        
                        <div class="progress-section">
                            <div class="progress-item">
                                <div class="progress-label"><span>Nächste Belohnung 🎁</span><span>${Math.round((count % step)*10)/10} / ${step}</span></div>
                                <div class="progress-bg"><div class="progress-fill fill-small" style="width:${progSmall}%"></div></div>
                            </div>
                            <div class="progress-item">
                                <div class="progress-label"><span>Großes Ziel 🏆</span><span>${Math.round(count)} / ${big}</span></div>
                                <div class="progress-bg"><div class="progress-fill fill-big" style="width:${progBig}%"></div></div>
                            </div>
                            <div class="progress-item">
                                <div class="progress-label"><span>Mega Ziel 💎</span><span>${Math.round(count)} / ${mega}</span></div>
                                <div class="progress-bg"><div class="progress-fill fill-mega" style="width:${progMega}%"></div></div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function openAddPointsModal(kidId) {
            activeKidForPoints = kidId;
            const l = document.getElementById('add-tasks-list');
            l.innerHTML = state.tasks.map(t => `
                <div class="task-btn-item" onclick="addPoints(${t.points}, '${t.name.replace(/'/g, "\\'")}')">
                    <span class="task-btn-name">${t.name}</span>
                    <span class="task-btn-points">+ ${t.points} ⭐</span>
                </div>`).join('');
            openModal('add-points-modal');
        }

        function addPoints(v, n) { updateCount(activeKidForPoints, v, n); closeModal('add-points-modal'); }
        function addCustomPoints() {
            const n = document.getElementById('custom-task-name').value.trim() || 'Manuell';
            const v = parseFloat(document.getElementById('custom-task-pts').value);
            if (!isNaN(v)) { addPoints(v, n); document.getElementById('custom-task-name').value=''; document.getElementById('custom-task-pts').value=''; }
        }

        function openConfig() {
            const c = document.getElementById('config-kids-fields');
            c.innerHTML = state.kids.map(k => `
                <div class="config-card">
                    <label>Kind: ${k.name}</label>
                    <input id="cn-${k.id}" value="${k.name}">
                    <div style="display:grid;grid-template-columns:3fr 1fr;gap:5px;">
                        <input id="cs-${k.id}" value="${k.sGoal}"> <input type="number" id="v1-${k.id}" value="${k.valSmall}">
                        <input id="cb-${k.id}" value="${k.bGoal}"> <input type="number" id="v2-${k.id}" value="${k.valBig}">
                        <input id="cm-${k.id}" value="${k.megaGoal}"> <input type="number" id="v3-${k.id}" value="${k.valMega}">
                    </div>
                </div>`).join('');
            renderTasksConfig();
            openModal('config-modal');
        }

        function renderTasksConfig() {
            document.getElementById('config-tasks-fields').innerHTML = state.tasks.map((t, i) => `
                <div class="edit-task-row">
                    <input id="tn-${i}" value="${t.name}">
                    <input type="number" step="0.5" id="tp-${i}" value="${t.points}">
                    <button class="btn-del-task" onclick="removeTaskConfig(${i})">🗑</button>
                </div>`).join('');
        }

        function saveConfig() {
            state.kids.forEach(k => {
                k.name = document.getElementById(`cn-${k.id}`).value;
                k.sGoal = document.getElementById(`cs-${k.id}`).value;
                k.bGoal = document.getElementById(`cb-${k.id}`).value;
                k.megaGoal = document.getElementById(`cm-${k.id}`).value;
                k.valSmall = parseInt(document.getElementById(`v1-${k.id}`).value) || 10;
                k.valBig = parseInt(document.getElementById(`v2-${k.id}`).value) || 100;
                k.valMega = parseInt(document.getElementById(`v3-${k.id}`).value) || 300;
            });
            state.tasks.forEach((t, i) => { t.name = document.getElementById(`tn-${i}`).value; t.points = parseFloat(document.getElementById(`tp-${i}`).value); });
            state.tasks = state.tasks.filter(t => t.name.trim() !== "");
            closeModal('config-modal'); render(); syncToCloud();
        }

        function loadDefaultTasks() {
            DEFAULT_TASKS_POOL.forEach(d => { if(!state.tasks.some(t => t.name === d.name)) state.tasks.push({ ...d, id: Date.now() + Math.random() }); });
            renderTasksConfig();
        }

        function addNewTaskInput() { state.tasks.push({ id: Date.now(), name: '', points: 1 }); renderTasksConfig(); }
        function removeTaskConfig(i) { state.tasks.splice(i, 1); renderTasksConfig(); }

        function openHistoryModal() {
            document.getElementById('history-list').innerHTML = state.history.length ? [...state.history].reverse().map(h => `
                <div class="task-btn-item" style="flex-direction:row;justify-content:space-between;width:100%;margin-bottom:5px;">
                    <div style="text-align:left;"><b>${h.kidName}</b>: ${h.taskName}</div>
                    <div style="color:${h.points>0?'var(--gold)':'#f87171'}">${h.points>0?'+':''}${h.points}</div>
                </div>`).join('') : '<p>Keine Einträge</p>';
            openModal('history-modal');
        }

        function openTasksInfoModal() {
            document.getElementById('info-goals-list').innerHTML = state.kids.map(k => `<div class="config-card"><b>${k.name}</b><br>${k.valSmall}er: ${k.sGoal}<br>${k.valBig}er: ${k.bGoal}<br>${k.valMega}er: ${k.megaGoal}</div>`).join('');
            document.getElementById('info-tasks-list').innerHTML = state.tasks.map(t => `<div class="task-btn-item"><span>${t.name}</span><span class="task-btn-points">${t.points}</span></div>`).join('');
            openModal('info-modal');
        }

        function openIconPicker(id) { activeKidForIcon = id; const icons = ['🦄','🚀','🦖','🐱','🐶','🦁','🦊','🦉','⭐','🌈','🎮','⚽','🎨','🎸','🛹','🚴','🦸','👑','🍕','🍔','🎈','🍭']; document.getElementById('icon-grid').innerHTML = icons.map(i => `<button class="icon-choice" onclick="selectIcon('${i}')">${i}</button>`).join(''); openModal('icon-modal'); }
        function selectIcon(i) { state.kids.find(k => k.id === activeKidForIcon).icon = i; render(); syncToCloud(); closeModal('icon-modal'); }

        function checkPin(a) { if (Date.now() - lastUnlockTime < UNLOCK_DURATION) a(); else { pendingAction = a; currentPin = ""; updatePinDots(); openModal('pin-modal'); } }
        function updatePinDots() { document.querySelectorAll('.dot').forEach((d, i) => d.className = i < currentPin.length ? 'dot filled' : 'dot'); }
        function updateUnlockDisplay() {
            const container = document.getElementById('unlock-status-container');
            const rem = UNLOCK_DURATION - (Date.now() - lastUnlockTime);
            if (rem > 0) {
                container.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><span style="color:var(--gold);font-weight:bold;">🔓 OFFEN (${Math.ceil(rem/1000)}s)</span><button onclick="manualLock()" style="background:rgba(239,68,68,0.2);border:1px solid #ef4444;color:#fca5a5;padding:2px 8px;border-radius:10px;cursor:pointer;">Sperren</button></div>`;
                setTimeout(updateUnlockDisplay, 1000);
            } else { container.innerHTML = '<span style="color:#94a3b8;font-weight:bold;">🔒 GESPERRT</span>'; }
        }

        const pad = document.getElementById('pin-pad');
        ["1","2","3","4","5","6","7","8","9","C","0","OK"].forEach(v => {
            const b = document.createElement('button'); b.className = "btn-key"; b.innerText = v;
            b.onclick = () => {
                if(v === "C") { currentPin = ""; updatePinDots(); }
                else if(v !== "OK" && currentPin.length < 4) {
                    currentPin += v; updatePinDots();
                    if(currentPin.length === 4) setTimeout(() => {
                        if(currentPin === PIN) { lastUnlockTime = Date.now(); pendingAction(); closeModal('pin-modal'); updateUnlockDisplay(); }
                        else { currentPin = ""; updatePinDots(); showMessage("Falsch! ❌"); }
                    }, 150);
                }
            };
            pad.appendChild(b);
        });

        initSync();
    </script>
</body>
</html>
