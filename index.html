<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kids Star Tracker Pro (Cloud Sync)</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Kinderfreundliche Schriftart -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --blue: #38bdf8;
            --blue-glow: rgba(56, 189, 248, 0.5);
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.6);
            --pink: #ec4899;
            --pink-glow: rgba(236, 72, 153, 0.5);
            --green: #4ade80;
            --text: #ffffff;
            --success: #22c55e;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Custom Scrollbar für die Modal-Fenster */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--blue); border-radius: 10px; }

        body {
            margin: 0;
            padding: 20px;
            background: var(--bg-gradient);
            color: var(--text);
            font-family: 'Baloo 2', cursive, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        header { text-align: center; padding: 5px 0 10px 0; }
        h1 { 
            font-size: 2.8rem; 
            margin: 0; 
            background: linear-gradient(to right, #fbbf24, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
            font-weight: 800;
        }

        #sync-status { 
            font-size: 0.8rem; 
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 600;
        }
        .dot-status { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
        .dot-online { background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulseDot 2s infinite; }

        @keyframes pulseDot { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }

        #unlock-status { font-size: 1rem; color: var(--gold); margin-top: 5px; font-weight: bold; height: 20px; }

        .btn-info {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--blue);
            color: var(--blue);
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Baloo 2';
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
            transition: all 0.2s;
        }
        .btn-info:active { transform: scale(0.95); }

        .kids-grid { display: grid; grid-template-columns: 1fr; gap: 25px; margin-top: 15px; }
        @media (min-width: 700px) { .kids-grid { grid-template-columns: 1fr 1fr; } }

        .kid-card {
            background: var(--card-bg);
            border-radius: 35px;
            padding: 25px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        .kid-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .kid-info h2 { margin: 0; font-size: 2.2rem; font-weight: 800; line-height: 1.1; }
        
        .btn-kid-reset {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
        }

        .avatar-btn { 
            font-size: 75px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 25px; 
            padding: 10px; 
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(3deg); } 100% { transform: translateY(0px) rotate(0deg); } }

        .goals-container { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .goal-pill { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .small-goal { background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(236, 72, 153, 0.4)); border: 1px solid var(--pink); color: #fdf2f8; }
        .big-goal { background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(251, 191, 36, 0.4)); border: 1px solid var(--gold); color: #fef3c7; }

        .tally-box {
            background: rgba(0,0,0,0.4);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            min-height: 110px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .star-icon {
            font-size: 2.2rem;
            color: var(--gold);
            text-shadow: 0 0 12px var(--gold-glow);
            animation: popStar 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0; transform: scale(0);
        }
        .half-star { font-size: 1.5rem; opacity: 0.8; filter: drop-shadow(0 0 5px var(--gold)); }
        
        @keyframes popStar { to { opacity: 1; transform: scale(1) rotate(360deg); } }

        .celebration-box { display: flex; flex-direction: column; align-items: center; justify-content: center; animation: pulseBox 1.5s infinite; }
        .celebration-box .c-icon { font-size: 2.5rem; animation: bounce 1s infinite; }
        .celebration-box .c-text { font-size: 1.2rem; font-weight: 800; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); margin-top: 5px; text-transform: uppercase; }

        @keyframes pulseBox { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
        .btn-action {
            border: none; border-radius: 25px; font-weight: 800; font-size: 2.5rem; cursor: pointer; height: 75px; transition: transform 0.1s;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .btn-action:active { transform: translateY(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-minus { background: #334155; color: #94a3b8; border: 1px solid #475569; }
        .btn-plus { 
            background: linear-gradient(135deg, #0ea5e9, #6366f1, #d946ef); 
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
            color: white; border: 2px solid rgba(255,255,255,0.3);
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .progress-section { margin-top: 25px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 1rem; color: #e2e8f0; font-weight: 600; margin-bottom: 8px; }
        .progress-bg { background: rgba(0,0,0,0.5); height: 20px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        
        .progress-fill { 
            height: 100%; transition: width 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: repeating-linear-gradient(45deg, var(--green), var(--green) 15px, #22c55e 15px, #22c55e 30px);
            background-size: 42.42px 42.42px; animation: moveStripes 1s linear infinite;
        }
        @keyframes moveStripes { 0% { background-position: 0 0; } 100% { background-position: 42.42px 0; } }

        .toolbar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px;
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(15px); padding: 15px; border-radius: 40px;
            display: flex; justify-content: center; border: 2px solid rgba(255,255,255,0.15); z-index: 50; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .modal.active { display: flex; }

        /* Scrollbare Container in Modals */
        .modal-content-scroll {
            background: var(--card-bg); width: 100%; max-width: 450px; max-height: 85vh; padding: 25px; 
            border-radius: 35px; border: 1px solid rgba(255,255,255,0.1); overflow-y: auto; position: relative;
        }

        /* Schließen X oben rechts */
        .btn-close-top {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white;
            border: none; width: 35px; height: 35px; border-radius: 50%; font-weight: bold; cursor: pointer;
            font-family: 'Baloo 2';
        }

        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 320px; }
        .btn-key { background: rgba(255,255,255,0.05); color: white; height: 75px; font-size: 2rem; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-family: 'Baloo 2'; font-weight: 800; }
        .pin-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 20px; height: 20px; border: 2px solid #64748b; border-radius: 50%; }
        .dot.filled { background: var(--blue); border-color: var(--blue); box-shadow: 0 0 10px var(--blue); }

        .config-card input { width: 100%; padding: 15px; margin: 5px 0 15px 0; background: rgba(0,0,0,0.3); border: 1px solid #475569; color: white; border-radius: 15px; font-size: 1.1rem; font-family: 'Baloo 2'; }
        
        .btn-master-reset { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border: none; padding: 15px; border-radius: 20px; width: 100%; font-weight: 800; font-size: 1.1rem; margin-top: 30px; cursor: pointer; font-family: 'Baloo 2'; }

        /* Add Points Modal UI */
        .quick-points-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-quick { background: var(--card-bg); border: 2px solid var(--blue); color: white; padding: 15px; border-radius: 20px; font-size: 1.5rem; font-weight: 800; font-family: 'Baloo 2'; cursor: pointer; }
        .btn-quick:active { background: var(--blue); }
        
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        .task-item { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 15px 20px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .task-item:active { background: rgba(56, 189, 248, 0.3); }
        .task-name { font-size: 1.1rem; font-weight: 600; }
        .task-points { background: var(--gold); color: #000; padding: 5px 12px; border-radius: 15px; font-weight: 800; font-size: 1rem; }

        /* Settings Tasks Editor */
        .edit-task-row { display: grid; grid-template-columns: 3fr 1fr 40px; gap: 10px; align-items: center; margin-bottom: 10px; }
        .edit-task-row input { margin: 0; }
        .btn-del-task { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; height: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;}

        #loading-screen { position: fixed; inset: 0; background: var(--bg-gradient); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 60px; height: 60px; border: 6px solid rgba(56, 189, 248, 0.2); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; }
        
        #message-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--card-bg); padding: 15px 30px; border-radius: 25px; border: 2px solid var(--blue); z-index: 2000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-weight: bold; font-size: 1.2rem; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: var(--blue); font-weight: bold; font-size: 1.2rem;">Lade bunte Sterne...</p>
    </div>

    <div id="message-box"></div>

    <div id="app">
        <header>
            <h1>STAR TRACKER</h1>
            <div id="sync-status">
                <div class="dot-status" id="status-dot"></div>
                <span id="status-text">Verbinde...</span>
            </div>
            <div id="unlock-status"></div>
            <!-- Info Button (Ohne PIN) -->
            <button class="btn-info" onclick="openTasksInfoModal()">📋 Aufgaben & Belohnungen ansehen</button>
        </header>
        <div id="kids-container" class="kids-grid"></div>
    </div>

    <div class="toolbar">
        <button style="background:none; color:white; font-weight:800; border:none; cursor:pointer; font-size: 1.2rem; font-family:'Baloo 2';" onclick="checkPin(() => openConfig())">⚙️ EINSTELLUNGEN</button>
    </div>

    <!-- MODAL: PIN -->
    <div id="pin-modal" class="modal">
        <h2 style="font-size: 2.5rem; margin-bottom: 5px;">Geheimcode</h2>
        <p style="color: #94a3b8; margin-bottom: 25px; font-size:1.1rem;">Eltern-PIN erforderlich</p>
        <div class="pin-dots" id="pin-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="pin-grid" id="pin-pad"></div>
        <button onclick="closePin()" style="margin-top: 30px; background: none; color: #94a3b8; border:none; cursor:pointer; font-size: 1.2rem; font-family:'Baloo 2'; font-weight:bold;">Abbrechen</button>
    </div>

    <!-- MODAL: Aufgaben & Belohnungen ansehen (Ohne PIN) -->
    <div id="info-modal" class="modal">
        <div class="modal-content-scroll">
            <button class="btn-close-top" onclick="closeModal('info-modal')">X</button>
            <h2 style="color: var(--blue); margin-top: 0;">So sammelst du Sterne!</h2>
            <div id="info-tasks-list" class="task-list" style="margin-bottom: 25px;"></div>
            
            <h2 style="color: var(--gold);">Aktuelle Belohnungen</h2>
            <div id="info-goals-list" style="display: flex; flex-direction: column; gap: 15px;"></div>
            
            <button onclick="closeModal('info-modal')" style="width: 100%; background: rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 20px; border:none; margin-top: 20px; font-weight:bold; font-size:1.2rem; cursor:pointer; font-family:'Baloo 2';">Schließen</button>
        </div>
    </div>

    <!-- MODAL: Punkte vergeben (Mit PIN davor) -->
    <div id="add-points-modal" class="modal">
        <div class="modal-content-scroll">
            <button class="btn-close-top" onclick="closeModal('add-points-modal')">X</button>
            <h2 id="add-points-title" style="margin-top: 0; color: var(--gold); text-align: center; font-size: 2rem;">Sterne vergeben</h2>
            
            <p style="color: #94a3b8; font-weight: 600; margin-bottom: 10px;">Manuelle Sterne</p>
            <div class="quick-points-grid">
                <button class="btn-quick" onclick="addPoints(0.5)">+ 0.5 ✨</button>
                <button class="btn-quick" onclick="addPoints(1.0)">+ 1.0 ⭐</button>
                <button class="btn-quick" onclick="addPoints(2.0)">+ 2.0 🌟</button>
                <button class="btn-quick" onclick="addPoints(3.0)">+ 3.0 💫</button>
            </div>

            <p style="color: #94a3b8; font-weight: 600; margin-bottom: 10px;">Aufgabe wählen</p>
            <div id="add-tasks-list" class="task-list"></div>

            <button onclick="closeModal('add-points-modal')" style="width: 100%; background: none; color: #94a3b8; border:none; margin-top: 20px; font-weight:bold; font-size:1.2rem; cursor:pointer; font-family:'Baloo 2';">Abbrechen</button>
        </div>
    </div>

    <!-- MODAL: Icon wählen -->
    <div id="icon-modal" class="modal">
        <h2 style="font-size: 2rem;">Wähle dein Icon!</h2>
        <div class="icon-grid" id="icon-grid"></div>
        <button onclick="closeModal('icon-modal')" style="margin-top: 30px; background: none; color: #94a3b8; border:none; cursor:pointer; font-size: 1.2rem; font-family:'Baloo 2'; font-weight:bold;">Schließen</button>
    </div>

    <!-- MODAL: Einstellungen -->
    <div id="config-modal" class="modal">
        <div class="modal-content-scroll">
            <button class="btn-close-top" onclick="closeConfig()">X</button>
            <h2 style="margin-top: 0; font-size: 2.2rem; color:var(--blue); text-align: center;">Einstellungen</h2>
            
            <div id="config-kids-fields"></div>
            
            <h3 style="color: var(--gold); margin-top: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">📋 Aufgaben bearbeiten</h3>
            <div id="config-tasks-fields"></div>
            <button onclick="addNewTaskInput()" style="background: rgba(255,255,255,0.1); border: 1px dashed rgba(255,255,255,0.3); color: white; width: 100%; padding: 12px; border-radius: 15px; font-family: 'Baloo 2'; font-weight: bold; cursor: pointer; margin-bottom: 20px;">+ Neue Aufgabe hinzufügen</button>

            <button onclick="saveConfig()" style="width: 100%; background: linear-gradient(135deg, #0ea5e9, #3b82f6); color: white; padding: 18px; border-radius: 20px; border:none; margin-top: 15px; font-weight:800; font-size:1.3rem; cursor:pointer; font-family:'Baloo 2'; box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);">SPEICHERN</button>
            <button onclick="closeConfig()" style="width: 100%; background: rgba(255,255,255,0.05); color: white; padding: 15px; border-radius: 20px; border:1px solid rgba(255,255,255,0.2); margin-top: 10px; cursor:pointer; font-size:1.1rem; font-family:'Baloo 2'; font-weight:bold;">Zurück zur Hauptseite</button>
            
            <button class="btn-master-reset" onclick="checkPin(() => resetSystem())">⚠️ ALLES AUF NULL SETZEN</button>
        </div>
    </div>

    <script>
        // CONFIG & STATE
        const PIN = "8458";
        const UNLOCK_DURATION = 3 * 60 * 1000; 
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'kids-star-tracker-pro';
        
        // Globale Firebase Variablen (sicher initialisieren)
        let auth = null;
        let db = null;
        let firebaseReady = false;

        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                const firebaseConfig = JSON.parse(__firebase_config);
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
                firebaseReady = true;
            }
        } catch (e) {
            console.error("Firebase Setup Error:", e);
        }

        let lastUnlockTime = 0;
        let currentPin = "";
        let pendingAction = null;
        let activeKidForIcon = null;
        let activeKidForPoints = null;

        const dbPath = `artifacts/${appId}/public/data/cloud_sync/state`;

        // Default state
        let state = {
            kids: [
                { id: 0, name: 'Noelle', icon: '🦄', sGoal: 'Eis essen', bGoal: 'Disneyland', count: 0 },
                { id: 1, name: 'Levi', icon: '🚀', sGoal: 'Lego Set', bGoal: 'Abenteuerpark', count: 0 }
            ],
            tasks: [
                { id: 1, name: 'Zimmer aufräumen', points: 2 },
                { id: 2, name: 'Hausaufgaben gemacht', points: 1.5 },
                { id: 3, name: 'Tisch abräumen helfen', points: 0.5 },
                { id: 4, name: 'Ohne Meckern ins Bett', points: 1 }
            ]
        };

        const availableIcons = ['🦄', '🚀', '🦖', '🐱', '🐶', '🦁', '🦊', '🦉', '⭐', '🌈', '🎮', '⚽', '🎨', '🍦', '🍕', '💎', '🚜', '🦒'];

        // UI HELPERS
        function showMessage(text) {
            const box = document.getElementById('message-box');
            box.innerText = text;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 3000);
        }

        function triggerConfetti() {
            if (window.confetti) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 }, colors: ['#38bdf8', '#fbbf24', '#ec4899', '#4ade80', '#ffffff'] });
            }
        }

        function updateUnlockDisplay() {
            const status = document.getElementById('unlock-status');
            const rem = UNLOCK_DURATION - (Date.now() - lastUnlockTime);
            if (rem > 0) {
                status.innerText = `🔓 GEÖFFNET (${Math.ceil(rem/1000)}s)`;
                setTimeout(updateUnlockDisplay, 1000);
            } else {
                status.innerText = "";
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function hideLoadingScreen() {
            const screen = document.getElementById('loading-screen');
            if(screen) screen.style.display = 'none';
        }

        // FIREBASE SYNC
        async function initSync() {
            // Wenn Firebase nicht existiert oder fehlerhaft ist, lade lokal!
            if (!firebaseReady) {
                hideLoadingScreen();
                document.getElementById('status-dot').className = 'dot-status';
                document.getElementById('status-text').innerText = 'Offline Modus';
                render();
                return;
            }

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                    await auth.signInAnonymously();
                }

                const docRef = db.doc(dbPath);

                docRef.onSnapshot((doc) => {
                    hideLoadingScreen();
                    document.getElementById('status-dot').className = 'dot-status dot-online';
                    document.getElementById('status-text').innerText = 'Cloud Verbunden';

                    if (doc.exists) {
                        const data = doc.data();
                        state.kids = data.kids || state.kids;
                        state.tasks = data.tasks || state.tasks;
                        render();
                    } else {
                        docRef.set(state);
                        render();
                    }
                }, (error) => {
                    console.error("Firestore Error:", error);
                    hideLoadingScreen();
                    document.getElementById('status-dot').className = 'dot-status';
                    document.getElementById('status-text').innerText = 'Offline (Kein Sync)';
                    render(); // Render local if cloud fails
                });

            } catch (e) {
                console.error("Auth error", e);
                hideLoadingScreen();
                document.getElementById('status-dot').className = 'dot-status';
                document.getElementById('status-text').innerText = 'Offline Modus';
                render(); // Render local if auth fails
            }
        }

        async function syncToCloud() {
            if (!firebaseReady || !auth.currentUser) return;
            try { 
                await db.doc(dbPath).set(state); 
            } catch (e) { 
                console.error("Sync Error", e); 
                showMessage("Speichern in Cloud fehlgeschlagen!"); 
            }
        }

        // RENDERING
        function renderTallies(count) {
            const exactCount = Math.round(count * 10) / 10;
            const block = exactCount % 10;
            
            if (exactCount > 0 && block === 0) {
                return `
                    <div class="celebration-box">
                        <div class="c-icon">🎁</div>
                        <div class="c-text">10er geschafft!</div>
                    </div>`;
            }
            
            if (block === 0) {
                return `<span style="color:rgba(255,255,255,0.5); font-size:1.1rem; font-weight:600;">Sammle 10 Sterne! ✨</span>`;
            }
            
            let marks = '';
            const fullStars = Math.floor(block);
            const hasHalf = (block % 1) !== 0;

            for(let i = 1; i <= fullStars; i++) {
                marks += `<div class="star-icon" style="animation-delay: ${i * 0.03}s">⭐</div>`;
            }
            if (hasHalf) {
                marks += `<div class="star-icon half-star" style="animation-delay: ${(fullStars+1)*0.03}s">🌟</div>`;
            }
            
            marks += `<div style="width: 100%; text-align: center; color: var(--gold); font-weight: 800; font-size: 0.9rem; margin-top: 5px;">${block} / 10</div>`;
            return marks;
        }

        function render() {
            const container = document.getElementById('kids-container');
            container.innerHTML = '';
            
            state.kids.forEach(k => {
                const exactCount = Math.round(k.count * 10) / 10;
                container.innerHTML += `
                    <div class="kid-card">
                        <div class="kid-header">
                            <div class="kid-info">
                                <h2>${k.name}</h2>
                            </div>
                            <button class="btn-kid-reset" onclick="checkPin(()=>resetKid(${k.id}))">↺ Reset</button>
                        </div>

                        <div class="goals-container">
                            <div class="goal-pill small-goal"><span>🎁</span> <span>${k.sGoal}</span></div>
                            <div class="goal-pill big-goal"><span>🏆</span> <span>${k.bGoal}</span></div>
                        </div>

                        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                             <div class="avatar-btn" onclick="openIconPicker(${k.id})">${k.icon}</div>
                             <div class="tally-box" style="flex: 1; margin-bottom: 0;">
                                ${renderTallies(k.count)}
                             </div>
                        </div>

                        <div class="controls">
                            <button class="btn-action btn-minus" onclick="checkPin(()=>updateCount(${k.id}, -0.5))">-</button>
                            <button class="btn-action btn-plus" onclick="checkPin(()=>openAddPointsModal(${k.id}))">+</button>
                        </div>

                        <div class="progress-section">
                            <div class="progress-label"><span>Master-Ziel</span><span>${exactCount} / 100</span></div>
                            <div class="progress-bg"><div class="progress-fill" style="width:${Math.min(100, exactCount)}%"></div></div>
                        </div>
                    </div>`;
            });
        }

        // --- NEUE PUNKTE-LOGIK ---
        function openAddPointsModal(kidId) {
            activeKidForPoints = kidId;
            const kid = state.kids.find(k => k.id === kidId);
            document.getElementById('add-points-title').innerText = `Punkte für ${kid.name}`;
            
            const list = document.getElementById('add-tasks-list');
            list.innerHTML = '';
            if(!state.tasks || state.tasks.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#94a3b8;">Keine Aufgaben angelegt. Nutze die Einstellungen!</p>`;
            } else {
                state.tasks.forEach(t => {
                    list.innerHTML += `
                        <div class="task-item" onclick="addPoints(${t.points})">
                            <span class="task-name">${t.name}</span>
                            <span class="task-points">+ ${t.points}</span>
                        </div>
                    `;
                });
            }
            openModal('add-points-modal');
        }

        function addPoints(value) {
            updateCount(activeKidForPoints, value);
            closeModal('add-points-modal');
        }

        function updateCount(id, v) { 
            const kid = state.kids.find(k => k.id === id);
            kid.count = Math.max(0, Math.round((kid.count + v) * 10) / 10);
            
            if (v > 0 && kid.count > 0 && kid.count % 10 === 0) {
                triggerConfetti();
            }
            
            render(); // SOFORTIGES Update für den Nutzer (verhindert Wartezeiten)
            syncToCloud(); // Speichert asynchron im Hintergrund
        }

        function resetKid(id) {
            const kid = state.kids.find(k => k.id === id);
            kid.count = Math.floor(kid.count / 10) * 10;
            render();
            syncToCloud();
        }

        function resetSystem() {
            if (confirm("MASTER RESET: Wirklich ALLES auf Null setzen? Dies kann nicht rückgängig gemacht werden!")) {
                state.kids.forEach(k => k.count = 0);
                closeConfig();
                render();
                syncToCloud();
            }
        }

        // --- INFO MODAL (Ohne PIN) ---
        function openTasksInfoModal() {
            const taskList = document.getElementById('info-tasks-list');
            taskList.innerHTML = '';
            state.tasks.forEach(t => {
                taskList.innerHTML += `
                    <div class="task-item" style="cursor: default;">
                        <span class="task-name">${t.name}</span>
                        <span class="task-points">+ ${t.points} ⭐</span>
                    </div>`;
            });

            const goalsList = document.getElementById('info-goals-list');
            goalsList.innerHTML = '';
            state.kids.forEach(k => {
                goalsList.innerHTML += `
                    <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">
                        <div style="font-weight: 800; font-size: 1.2rem; color: var(--blue); margin-bottom: 8px;">${k.icon} ${k.name}</div>
                        <div style="display:flex; flex-direction:column; gap:5px;">
                            <div class="goal-pill small-goal" style="justify-content: flex-start;"><span>🎁 10er:</span> <span>${k.sGoal}</span></div>
                            <div class="goal-pill big-goal" style="justify-content: flex-start;"><span>🏆 100er:</span> <span>${k.bGoal}</span></div>
                        </div>
                    </div>`;
            });

            openModal('info-modal');
        }

        // --- PIN LOGIC ---
        function checkPin(action) {
            if (Date.now() - lastUnlockTime < UNLOCK_DURATION) { action(); } 
            else { askPin(action); }
        }

        function askPin(action) {
            pendingAction = action; currentPin = ""; updatePinDots();
            openModal('pin-modal');
        }

        function closePin() { closeModal('pin-modal'); }

        function updatePinDots() {
            document.querySelectorAll('.dot').forEach((d, i) => { d.className = i < currentPin.length ? 'dot filled' : 'dot'; });
        }

        function pressKey(k) {
            if(currentPin.length < 4) {
                currentPin += k; updatePinDots();
                if(currentPin.length === 4) {
                    setTimeout(() => {
                        if(currentPin === PIN) { 
                            lastUnlockTime = Date.now(); 
                            if(pendingAction) pendingAction(); 
                            closePin(); updateUnlockDisplay();
                        } else { 
                            currentPin = ""; updatePinDots(); showMessage("PIN Falsch! ❌"); 
                        }
                    }, 150);
                }
            }
        }

        // --- SETTINGS / CONFIG ---
        function openConfig() {
            const kidsFields = document.getElementById('config-kids-fields');
            kidsFields.innerHTML = state.kids.map(k => `
                <div style="margin-bottom:20px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.05);">
                    <label style="color:var(--blue); font-weight:800; font-size:1.1rem; display:block; margin-bottom:5px;">Kind ${k.id + 1}</label>
                    <input id="n-${k.id}" value="${k.name}" placeholder="Name">
                    <label style="color:var(--pink); font-weight:800; font-size:1rem; display:block; margin-bottom:5px; margin-top:10px;">🎁 10er ZIEL</label>
                    <input id="s-${k.id}" value="${k.sGoal}" placeholder="10er Ziel">
                    <label style="color:var(--gold); font-weight:800; font-size:1rem; display:block; margin-bottom:5px; margin-top:10px;">🏆 100er ZIEL</label>
                    <input id="b-${k.id}" value="${k.bGoal}" placeholder="100er Ziel">
                </div>`).join('');
            
            renderTasksConfig();
            openModal('config-modal');
        }

        function renderTasksConfig() {
            const tasksFields = document.getElementById('config-tasks-fields');
            tasksFields.innerHTML = '';
            
            if(!state.tasks) state.tasks = [];
            
            state.tasks.forEach((t, index) => {
                tasksFields.innerHTML += `
                    <div class="edit-task-row">
                        <input id="t-name-${index}" value="${t.name}" placeholder="Aufgabenname">
                        <input id="t-pts-${index}" type="number" step="0.5" value="${t.points}" placeholder="0.5">
                        <button class="btn-del-task" onclick="removeTaskConfig(${index})">🗑</button>
                    </div>
                `;
            });
        }

        function addNewTaskInput() {
            saveTasksStateFromInputs();
            state.tasks.push({ id: Date.now(), name: '', points: 1 });
            renderTasksConfig();
        }

        function removeTaskConfig(index) {
            saveTasksStateFromInputs();
            state.tasks.splice(index, 1);
            renderTasksConfig();
        }

        function saveTasksStateFromInputs() {
            state.tasks.forEach((t, index) => {
                const nameInput = document.getElementById(`t-name-${index}`);
                const ptsInput = document.getElementById(`t-pts-${index}`);
                if(nameInput) t.name = nameInput.value;
                if(ptsInput) t.points = parseFloat(ptsInput.value) || 1;
            });
        }

        function saveConfig() {
            state.kids.forEach(k => { 
                k.name = document.getElementById(`n-${k.id}`).value;
                k.sGoal = document.getElementById(`s-${k.id}`).value; 
                k.bGoal = document.getElementById(`b-${k.id}`).value; 
            });
            saveTasksStateFromInputs();
            state.tasks = state.tasks.filter(t => t.name.trim() !== "");

            closeConfig(); 
            render();
            syncToCloud();
        }
        
        function closeConfig() { closeModal('config-modal'); }

        // --- ICON PICKER ---
        function openIconPicker(id) {
            activeKidForIcon = id;
            const grid = document.getElementById('icon-grid'); grid.innerHTML = '';
            availableIcons.forEach(i => {
                const b = document.createElement('button'); b.className = 'icon-choice'; b.innerText = i;
                b.onclick = () => { 
                    state.kids.find(k=>k.id===activeKidForIcon).icon = i; 
                    render();
                    syncToCloud(); 
                    closeModal('icon-modal'); 
                };
                grid.appendChild(b);
            });
            openModal('icon-modal');
        }

        // PIN PAD INIT
        const pad = document.getElementById('pin-pad');
        ["1","2","3","4","5","6","7","8","9","C","0","OK"].forEach(k => {
            const b = document.createElement('button'); b.className = "btn-key"; b.innerText = k;
            b.onclick = () => {
                if(k === "C") { currentPin = ""; updatePinDots(); }
                else if(k === "OK") { /* Auto-submit */ }
                else pressKey(k);
            };
            pad.appendChild(b);
        });

        // Startpunkt
        window.onload = initSync;
    </script>
</body>
</html>
