<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kids Stars Pro</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <style>
        @import url('[https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap](https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap)');
        :root { --primary-bg: #0f172a; --accent-blue: #38bdf8; --accent-gold: #fbbf24; }
        body { font-family: 'Inter', sans-serif; background-color: var(--primary-bg); color: white; user-select: none; -webkit-user-select: none; touch-action: manipulation; height: 100vh; overflow: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tally-mark { width: 10px; height: 50px; background: var(--accent-blue); border-radius: 5px; display: inline-block; margin: 4px; transform: rotate(-5deg); transition: 0.2s; }
        .tally-mark.golden { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 0 20px rgba(251, 191, 36, 0.6); width: 12px; height: 55px; }
        .btn-xl { @apply active:scale-95 transition-transform flex items-center justify-center font-bold text-6xl rounded-[3rem] shadow-2xl h-40; }
        .progress-bar { transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="p-6 md:p-12 flex flex-col">
    <div id="app" class="max-w-6xl mx-auto w-full flex-1 flex flex-col space-y-8 overflow-y-auto pb-40">
        <header class="text-center py-6">
            <h1 class="text-5xl font-orbitron font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-pink-500">STAR TRACKER</h1>
            <div id="motivation-text" class="mt-6 text-blue-300 text-xl font-medium italic min-h-[4rem]"></div>
        </header>
        <div id="kids-container" class="grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-16"></div>
    </div>

    <div class="fixed bottom-12 left-1/2 -translate-x-1/2 w-full max-w-xl px-8">
        <div class="glass rounded-full p-5 flex justify-around items-center shadow-2xl border-white/20">
            <button onclick="openConfig()" class="p-6 bg-white/5 rounded-full"><svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg></button>
            <div class="h-14 w-px bg-white/10"></div>
            <button onclick="askPin(() => resetAll())" class="text-red-400 font-bold px-12 py-5 rounded-full text-xl tracking-widest">RESET</button>
        </div>
    </div>

    <div id="pin-modal" class="fixed inset-0 bg-slate-950/98 backdrop-blur-3xl hidden flex flex-col items-center justify-center z-[200] p-10">
        <h2 class="text-5xl font-orbitron font-bold text-blue-400 mb-12">Security Code</h2>
        <div id="pin-display" class="flex gap-10 mb-16">
            <div class="w-10 h-10 rounded-full border-4 border-slate-700"></div>
            <div class="w-10 h-10 rounded-full border-4 border-slate-700"></div>
            <div class="w-10 h-10 rounded-full border-4 border-slate-700"></div>
            <div class="w-10 h-10 rounded-full border-4 border-slate-700"></div>
        </div>
        <div class="grid grid-cols-3 gap-8 w-full max-w-[500px]" id="numpad"></div>
    </div>

    <div id="config-modal" class="fixed inset-0 bg-black/95 backdrop-blur-2xl hidden flex items-center justify-center z-[150] p-10">
        <div class="glass w-full max-w-3xl p-12 rounded-[4rem] space-y-10">
            <h2 class="text-4xl font-bold font-orbitron text-center">Settings</h2>
            <div id="config-content" class="space-y-8"></div>
            <button onclick="saveConfig()" class="w-full py-8 bg-blue-600 rounded-3xl font-bold text-3xl">SPEICHERN</button>
        </div>
    </div>

    <script>
        const PIN = "8458";
        let curPin = "", pendAct = null;
        let state = JSON.parse(localStorage.getItem('stars_v_final')) || {
            kids: [
                {id:0, name:'Noelle', icon:'🦄', sGoal:'Eis', bGoal:'Disneyland', count:0},
                {id:1, name:'Levi', icon:'🚀', sGoal:'Lego', bGoal:'Zoo', count:0}
            ]
        };
        const quotes = ["Du bist ein Star!", "Super fleißig!", "Fast geschafft!", "Bleib dran!", "Power-Tag!"];
        const audio = new (window.AudioContext || window.webkitAudioContext)();
        function beep(f, t='sine', d=0.1) {
            const o = audio.createOscillator(), g = audio.createGain();
            o.type = t; o.frequency.value = f; g.gain.value = 0.1;
            o.connect(g); g.connect(audio.destination);
            o.start(); o.stop(audio.currentTime + d);
        }
        function render() {
            const container = document.getElementById('kids-container');
            container.innerHTML = '';
            const low = [...state.kids].sort((a,b)=>a.count-b.count)[0];
            document.getElementById('motivation-text').innerText = state.kids[0].count != state.kids[1].count ? low.name + ": " + quotes[Math.floor(Math.random()*quotes.length)] : "Beide sind spitze!";
            state.kids.forEach(k => {
                const cur = k.count % 10 || (k.count > 0 ? 10 : 0);
                let marks = '';
                for(let i=1; i<=cur; i++) marks += `<div class="tally ${i==10?'golden':''}"></div>`;
                container.innerHTML += `
                    <div class="glass rounded-[4.5rem] p-10 space-y-8 relative">
                        <div class="flex justify-between items-center">
                            <span class="text-8xl">${k.icon}</span>
                            <div class="text-right">
                                <h2 class="text-4xl font-bold font-orbitron">${k.name}</h2>
                                <p class="text-blue-400 font-bold uppercase text-xl">${k.sGoal}</p>
                            </div>
                        </div>
                        <div class="h-40 bg-black/40 rounded-[3rem] flex items-center px-8 gap-2 border border-white/5">${marks || '<span class="text-slate-600 italic text-2xl w-full text-center">Los geht\'s!</span>'}</div>
                        <div class="grid grid-cols-3 gap-8">
                            <button onclick="askPin(()=>upd(${k.id},-1))" class="btn-xl bg-slate-800 text-slate-500">-</button>
                            <button onclick="askPin(()=>upd(${k.id},1))" class="btn-xl col-span-2 bg-blue-600 text-white">+</button>
                        </div>
                        <div class="pt-8 border-t border-white/10">
                            <div class="flex justify-between text-lg font-bold text-slate-400 mb-2 uppercase"><span>Ziel: ${k.bGoal}</span><span>${k.count}/100</span></div>
                            <div class="h-5 bg-slate-900 rounded-full overflow-hidden"><div class="progress-bar h-full bg-blue-500" style="width:${Math.min(100, k.count)}%"></div></div>
                        </div>
                    </div>`;
            });
        }
        function upd(id, v) {
            const k = state.kids.find(x=>x.id==id);
            k.count = Math.max(0, k.count + v);
            v > 0 ? beep(600) : beep(200);
            save();
        }
        function save() { localStorage.setItem('stars_v_final', JSON.stringify(state)); render(); }
        function askPin(a) { pendAct = a; curPin = ""; updDots(); document.getElementById('pin-modal').classList.remove('hidden'); }
        function press(k) {
            if(curPin.length < 4) curPin += k;
            updDots();
            if(curPin.length == 4) {
                if(curPin == PIN) { if(pendAct) pendAct(); closePin(); }
                else { beep(100, 'square'); curPin = ""; updDots(); }
            }
        }
        function updDots() { document.querySelectorAll('#pin-display div').forEach((d,i)=> d.className = `w-10 h-10 rounded-full border-4 ${i<curPin.length?'bg-blue-400 border-blue-400':'border-slate-700'}`); }
        function closePin() { document.getElementById('pin-modal').classList.add('hidden'); }
        const pad = document.getElementById('numpad');
        ["1","2","3","4","5","6","7","8","9","X","0","CLR"].forEach(k => {
            const b = document.createElement('button'); b.className = "glass h-28 text-5xl font-bold rounded-[2.5rem] active:bg-blue-500/40 transition-all flex items-center justify-center";
            b.innerText = k; b.onclick = () => k=='X'?closePin():k=='CLR'?(curPin="",updDots()):press(k); pad.appendChild(b);
        });
        function openConfig() {
            const content = document.getElementById('config-content');
            content.innerHTML = state.kids.map(k => `
                <div class="space-y-6">
                    <p class="text-3xl font-bold text-blue-400">${k.name}</p>
                    <input id="s-${k.id}" value="${k.sGoal}" class="w-full bg-black/40 p-6 rounded-3xl border border-white/10 text-2xl" placeholder="10er Ziel">
                    <input id="b-${k.id}" value="${k.bGoal}" class="w-full bg-black/40 p-6 rounded-3xl border border-white/10 text-2xl" placeholder="100er Ziel">
                </div>`).join('');
            document.getElementById('config-modal').classList.remove('hidden');
        }
        function saveConfig() {
            state.kids.forEach(k => { k.sGoal = document.getElementById('s-'+k.id).value; k.bGoal = document.getElementById('b-'+k.id).value; });
            document.getElementById('config-modal').classList.add('hidden'); save();
        }
        function resetAll() { if(confirm("ALLES löschen?")) { state.kids.forEach(k=>k.count=0); save(); } }
        window.onload = render;
    </script>
</body>
</html>
