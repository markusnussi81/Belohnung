<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kids Star Tracker Pro</title>
    <style>
        /* DESIGN-EINSTELLUNGEN */
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --blue: #38bdf8;
            --gold: #fbbf24;
            --pink: #ec4899;
            --text: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        header { text-align: center; padding: 10px 0; }
        h1 { 
            font-size: 2.5rem; 
            margin: 0; 
            background: linear-gradient(to right, var(--blue), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        #unlock-status { font-size: 0.9rem; color: var(--gold); margin-top: 5px; font-weight: bold; height: 20px; }

        .kids-grid { display: grid; grid-template-columns: 1fr; gap: 25px; margin-top: 15px; }
        @media (min-width: 700px) { .kids-grid { grid-template-columns: 1fr 1fr; } }

        .kid-card {
            background: var(--card);
            border-radius: 35px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .kid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .avatar-btn { 
            font-size: 65px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 20px; 
            padding: 8px; 
            cursor: pointer;
            border: 2px solid transparent;
        }

        .kid-info h2 { margin: 0; font-size: 1.8rem; }
        .kid-info p { margin: 0; color: var(--blue); font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }

        .tally-box {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            min-height: 90px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .tally {
            width: 8px;
            height: 42px;
            background: var(--blue);
            border-radius: 4px;
            transform: rotate(-5deg);
        }
        .tally.gold {
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold);
            height: 48px;
        }

        .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
        .btn-action {
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 2.2rem;
            cursor: pointer;
            height: 80px;
        }
        .btn-minus { background: #334155; color: #94a3b8; }
        .btn-plus { background: linear-gradient(to bottom right, #0ea5e9, #6366f1); color: white; }

        .progress-section { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
        .progress-bg { background: #0f172a; height: 14px; border-radius: 7px; overflow: hidden; }
        .progress-fill { background: linear-gradient(to right, var(--blue), var(--pink)); height: 100%; transition: width 0.5s; }

        .toolbar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 50;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .modal.active { display: flex; }

        .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .icon-choice { font-size: 45px; background: var(--card); border: none; border-radius: 15px; padding: 12px; }

        .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 320px; }
        .btn-key { background: #1e293b; color: white; height: 75px; font-size: 1.8rem; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .pin-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 18px; height: 18px; border: 2px solid #334155; border-radius: 50%; }
        .dot.filled { background: var(--blue); border-color: var(--blue); }

        .config-card { background: #1e293b; width: 100%; max-width: 450px; padding: 25px; border-radius: 30px; }
        .config-card input { width: 100%; padding: 15px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="app">
        <header>
            <h1>STAR TRACKER</h1>
            <div id="unlock-status"></div>
        </header>
        <div id="kids-container" class="kids-grid"></div>
    </div>

    <div class="toolbar">
        <button style="background:none; color:white; font-weight:bold; border:none; cursor:pointer;" onclick="checkPin(() => openConfig())">⚙️ SETTINGS</button>
        <button style="background:none; color:#f87171; font-weight:bold; border:none; cursor:pointer;" onclick="checkPin(() => resetSystem())">🔄 RESET ALL</button>
    </div>

    <!-- MODALE -->
    <div id="pin-modal" class="modal">
        <h2 style="font-size: 2rem;">Security Code</h2>
        <div class="pin-dots" id="pin-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="pin-grid" id="pin-pad"></div>
        <button onclick="closePin()" style="margin-top: 30px; background: none; color: #64748b; border:none;">Abbrechen</button>
    </div>

    <div id="icon-modal" class="modal">
        <h2>Wähle dein Icon</h2>
        <div class="icon-grid" id="icon-grid"></div>
        <button onclick="closeIconPicker()" style="margin-top: 30px; background: none; color: #64748b; border:none;">Schließen</button>
    </div>

    <div id="config-modal" class="modal">
        <div class="config-card">
            <h2>Ziele ändern</h2>
            <div id="config-fields"></div>
            <button onclick="saveConfig()" style="width: 100%; background: var(--blue); color: white; padding: 18px; border-radius: 15px; border:none; margin-top: 15px; font-weight:bold;">SPEICHERN</button>
            <button onclick="closeConfig()" style="width: 100%; background: none; color: #64748b; margin-top: 10px; border:none;">Abbrechen</button>
        </div>
    </div>

    <script>
        const PIN = "8458";
        const UNLOCK_DURATION = 3 * 60 * 1000; 
        let lastUnlockTime = 0;
        let currentPin = "";
        let pendingAction = null;
        let activeKidForIcon = null;

        let state = JSON.parse(localStorage.getItem('stars_v3_final')) || {
            kids: [
                { id: 0, name: 'Noelle', icon: '🦄', sGoal: 'Eis essen', bGoal: 'Disneyland', count: 0 },
                { id: 1, name: 'Levi', icon: '🚀', sGoal: 'Lego Set', bGoal: 'Abenteuerpark', count: 0 }
            ]
        };

        const availableIcons = ['🦄', '🚀', '🦖', '🐱', '🐶', '🦁', '🦊', '🦉', '⭐', '🌈', '🎮', '⚽', '🎨', '🍦', '🍕', '💎'];

        function render() {
            const container = document.getElementById('kids-container');
            container.innerHTML = '';
            state.kids.forEach(k => {
                const block = k.count % 10 || (k.count > 0 ? 10 : 0);
                let marks = '';
                for(let i=1; i<=block; i++) marks += `<div class="tally ${i===10?'gold':''}"></div>`;
                container.innerHTML += `
                    <div class="kid-card">
                        <div class="kid-header">
                            <div class="kid-info"><h2>${k.name}</h2><p>${k.sGoal}</p></div>
                            <div class="avatar-btn" onclick="openIconPicker(${k.id})">${k.icon}</div>
                        </div>
                        <div class="tally-box">${marks || 'Bereit?'}</div>
                        <div class="controls">
                            <button class="btn-action btn-minus" onclick="checkPin(()=>update(${k.id},-1))">-</button>
                            <button class="btn-action btn-plus" onclick="checkPin(()=>update(${k.id},1))">+</button>
                        </div>
                        <div class="progress-section">
                            <div class="progress-label"><span>${k.bGoal}</span><span>${k.count}/100</span></div>
                            <div class="progress-bg"><div class="progress-fill" style="width:${Math.min(100, k.count)}%"></div></div>
                        </div>
                    </div>`;
            });
            updateUnlockDisplay();
        }

        function checkPin(action) {
            if (Date.now() - lastUnlockTime < UNLOCK_DURATION) action();
            else askPin(action);
        }

        function askPin(action) {
            pendingAction = action; currentPin = ""; updatePinDots();
            document.getElementById('pin-modal').classList.add('active');
        }

        function updatePinDots() {
            document.querySelectorAll('.dot').forEach((d, i) => d.className = i < currentPin.length ? 'dot filled' : 'dot');
        }

        function pressKey(k) {
            if(currentPin.length < 4) {
                currentPin += k; updatePinDots();
                if(currentPin.length === 4) {
                    setTimeout(() => {
                        if(currentPin === PIN) { lastUnlockTime = Date.now(); if(pendingAction) pendingAction(); closePin(); startTimer(); }
                        else { currentPin = ""; updatePinDots(); alert("Falsch!"); }
                    }, 100);
                }
            }
        }

        function startTimer() {
            setInterval(() => updateUnlockDisplay(), 1000);
        }

        function updateUnlockDisplay() {
            const status = document.getElementById('unlock-status');
            const rem = UNLOCK_DURATION - (Date.now() - lastUnlockTime);
            status.innerText = rem > 0 ? `🔓 OFFEN (${Math.ceil(rem/1000)}s)` : "";
        }

        function openIconPicker(id) {
            activeKidForIcon = id;
            const grid = document.getElementById('icon-grid'); grid.innerHTML = '';
            availableIcons.forEach(i => {
                const b = document.createElement('button'); b.className = 'icon-choice'; b.innerText = i;
                b.onclick = () => { state.kids.find(k=>k.id===activeKidForIcon).icon = i; save(); closeIconPicker(); };
                grid.appendChild(b);
            });
            document.getElementById('icon-modal').classList.add('active');
        }

        function closeIconPicker() { document.getElementById('icon-modal').classList.remove('active'); }
        function update(id, v) { state.kids.find(k=>k.id===id).count = Math.max(0, state.kids.find(k=>k.id===id).count + v); save(); }
        function save() { localStorage.setItem('stars_v3_final', JSON.stringify(state)); render(); }
        function closePin() { document.getElementById('pin-modal').classList.remove('active'); }

        const pad = document.getElementById('pin-pad');
        ["1","2","3","4","5","6","7","8","9","C","0","OK"].forEach(k => {
            const b = document.createElement('button'); b.className = "btn-key"; b.innerText = k;
            b.onclick = () => k === "C" ? (currentPin="", updatePinDots()) : (k !== "OK" ? pressKey(k) : null);
            pad.appendChild(b);
        });

        function openConfig() {
            const fields = document.getElementById('config-fields');
            fields.innerHTML = state.kids.map(k => `
                <div style="margin-bottom:15px;">
                    <label style="color:var(--blue);font-weight:bold;">${k.name}</label>
                    <input id="s-${k.id}" value="${k.sGoal}" placeholder="10er Ziel">
                    <input id="b-${k.id}" value="${k.bGoal}" placeholder="100er Ziel">
                </div>`).join('');
            document.getElementById('config-modal').classList.add('active');
        }
        function saveConfig() {
            state.kids.forEach(k => { k.sGoal = document.getElementById(`s-${k.id}`).value; k.bGoal = document.getElementById(`b-${k.id}`).value; });
            closeConfig(); save();
        }
        function closeConfig() { document.getElementById('config-modal').classList.remove('active'); }
        function resetSystem() { if(confirm("RESET?")) { state.kids.forEach(k => k.count = 0); save(); } }

        window.onload = render;
    </script>
</body>
</html>
